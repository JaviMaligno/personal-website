[project]
name = "aa"
version = "0.1.0"
description = "Do more abstractions + harsh lint constrain coding agents?"
requires-python = ">=3.12"
dependencies = ["unidiff>=0.7", "statsmodels>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aa = "aa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the Actual checkout / Docker, not run by default"]

[tool.setuptools.package-data]
aa = ["templates/*.html", "prompt.md"]
