<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
$base_css
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.col { min-width: 0; }
.ev { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; background: var(--surface); }
.ev .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.ev.text { border-left: 3px solid var(--accent); }
.ev.tool { border-left: 3px solid var(--muted); }
.ev.tool.err { border-left-color: var(--bad); }
.ev.error { border-left: 3px solid var(--bad); }
.ev .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
details.thinking > summary { color: var(--muted); font-style: italic; }
.out { margin-top: 6px; }
.diffwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; background: var(--surface); }
table.diff { border-collapse: collapse; width: 100%; font: 12px/1.45 var(--mono); }
table.diff td { padding: 0 6px; white-space: pre; vertical-align: top; }
table.diff td.ln { color: var(--muted); text-align: right; user-select: none; width: 1%; }
table.diff tr.file td { background: var(--surface-2); font-weight: 600; padding: 4px 6px; white-space: normal; overflow-wrap: anywhere; }
table.diff tr.hunk td { color: var(--muted); background: var(--surface-2); }
table.diff tr.add td.code { background: var(--add-bg); }
table.diff tr.del td.code { background: var(--del-bg); }
mark.violation { background: var(--bad-bg); color: inherit; outline: 1px solid var(--bad); border-radius: 2px; }
ul.violations li { margin-bottom: 4px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
<h1>$title</h1>
<div class="facts">$facts</div>
</header>
<main>
<section>
<h2>Violations</h2>
$violations
</section>
<div class="layout">
<section class="col">
<h2>Conversation</h2>
$conversation
</section>
<section class="col">
<h2>Agent diff</h2>
$agent_diff
<h2>Reference diff</h2>
$reference_diff
</section>
</div>
</main>
</body>
</html>
