<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent abstractions status</title>
<style>
$base_css
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
table.grid { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
table.grid th, table.grid td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
table.grid th:first-child, table.grid td:first-child, table.grid th.l, table.grid td.l { text-align: left; }
table.grid thead th { background: var(--surface-2); font-weight: 600; }
table.grid tr.agent th { background: var(--surface-2); text-align: left; }
table.grid tr:last-child td { border-bottom: 0; }
ul.latest { padding-left: 18px; }
ul.latest li { margin-bottom: 4px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
<h1>Agent abstractions: run status</h1>
<div class="facts">$facts</div>
</header>
<main>
<section>
<h2>Progress by agent and condition</h2>
<div class="tablewrap">$grid</div>
<p class="note">Rates over finished runs (<code>ok</code> + <code>timeout</code>; timeout counts as not correct), with 95% Wilson intervals. Tokens = input + output per run. <code>infra</code> runs are retried and never counted.</p>
</section>
<section>
<h2>Latest problem runs</h2>
$latest
</section>
</main>
</body>
</html>
