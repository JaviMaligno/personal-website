<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07 - Botanical Illustration (v2)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f0e8;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  .container {
    width: 700px;
    text-align: center;
  }
  svg {
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 2px 8px rgba(120,100,70,0.12));
  }
  .title {
    margin-top: 18px;
    font-size: 15px;
    color: #8a7b6b;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <!-- Paper texture filter -->
    <filter id="paperTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="6" seed="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="textured"/>
      <feComponentTransfer in="textured">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>

    <!-- Watercolor edge effect - organic edges -->
    <filter id="watercolor" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="5" seed="3" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="5" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="0.6" result="blurred"/>
      <feComponentTransfer in="blurred">
        <feFuncA type="linear" slope="0.93"/>
      </feComponentTransfer>
    </filter>

    <!-- Stronger watercolor for petals -->
    <filter id="watercolorStrong" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="turbulence" baseFrequency="0.018" numOctaves="5" seed="7" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="1.2" result="blurred"/>
      <feComponentTransfer in="blurred">
        <feFuncA type="linear" slope="0.88"/>
      </feComponentTransfer>
    </filter>

    <!-- Soft watercolor wash -->
    <filter id="watercolorWash" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="4" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="2" result="blurred"/>
      <feComponentTransfer in="blurred">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
    </filter>

    <!-- Wing vein detail filter -->
    <filter id="veinDetail" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" seed="5" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Leaf texture -->
    <filter id="leafTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="0.5"/>
    </filter>

    <!-- Stem texture -->
    <filter id="stemTexture" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="15" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="0.4"/>
    </filter>

    <!-- Fuzzy body texture -->
    <filter id="fuzzyBody" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="4" seed="22" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="0.4"/>
    </filter>

    <!-- Pigment granulation effect for watercolor cells -->
    <filter id="pigmentGrain" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="40" result="grain"/>
      <feColorMatrix type="saturate" values="0" in="grain" result="grayGrain"/>
      <feBlend in="SourceGraphic" in2="grayGrain" mode="multiply" result="grained"/>
      <feComponentTransfer in="grained">
        <feFuncA type="linear" slope="0.95"/>
      </feComponentTransfer>
    </filter>

    <!-- Cell gradients - each cell gets unique gradient for depth -->
    <!-- Left forewing cells -->
    <linearGradient id="cellLF1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f5a040"/>
      <stop offset="50%" stop-color="#e87820"/>
      <stop offset="100%" stop-color="#d06818"/>
    </linearGradient>
    <linearGradient id="cellLF2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f0952e"/>
      <stop offset="50%" stop-color="#e58025"/>
      <stop offset="100%" stop-color="#cc6012"/>
    </linearGradient>
    <linearGradient id="cellLF3" x1="0%" y1="20%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8a848"/>
      <stop offset="40%" stop-color="#e88828"/>
      <stop offset="100%" stop-color="#c85a10"/>
    </linearGradient>
    <linearGradient id="cellLF4" x1="10%" y1="0%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#f09535"/>
      <stop offset="60%" stop-color="#e07520"/>
      <stop offset="100%" stop-color="#c05510"/>
    </linearGradient>
    <linearGradient id="cellLF5" x1="0%" y1="10%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a040"/>
      <stop offset="45%" stop-color="#e88525"/>
      <stop offset="100%" stop-color="#c86015"/>
    </linearGradient>

    <!-- Right forewing cells -->
    <linearGradient id="cellRF1" x1="100%" y1="0%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#f5a040"/>
      <stop offset="50%" stop-color="#e87820"/>
      <stop offset="100%" stop-color="#d06818"/>
    </linearGradient>
    <linearGradient id="cellRF2" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#f0952e"/>
      <stop offset="50%" stop-color="#e58025"/>
      <stop offset="100%" stop-color="#cc6012"/>
    </linearGradient>
    <linearGradient id="cellRF3" x1="100%" y1="20%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8a848"/>
      <stop offset="40%" stop-color="#e88828"/>
      <stop offset="100%" stop-color="#c85a10"/>
    </linearGradient>
    <linearGradient id="cellRF4" x1="90%" y1="0%" x2="10%" y2="90%">
      <stop offset="0%" stop-color="#f09535"/>
      <stop offset="60%" stop-color="#e07520"/>
      <stop offset="100%" stop-color="#c05510"/>
    </linearGradient>
    <linearGradient id="cellRF5" x1="100%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5a040"/>
      <stop offset="45%" stop-color="#e88525"/>
      <stop offset="100%" stop-color="#c86015"/>
    </linearGradient>

    <!-- Hindwing cell gradients -->
    <linearGradient id="cellLH1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88028"/>
      <stop offset="50%" stop-color="#d86818"/>
      <stop offset="100%" stop-color="#c05510"/>
    </linearGradient>
    <linearGradient id="cellLH2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e57520"/>
      <stop offset="100%" stop-color="#b84a0a"/>
    </linearGradient>
    <linearGradient id="cellRH1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e88028"/>
      <stop offset="50%" stop-color="#d86818"/>
      <stop offset="100%" stop-color="#c05510"/>
    </linearGradient>
    <linearGradient id="cellRH2" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#e57520"/>
      <stop offset="100%" stop-color="#b84a0a"/>
    </linearGradient>

    <!-- Body gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2020"/>
      <stop offset="50%" stop-color="#1a1515"/>
      <stop offset="100%" stop-color="#2a2020"/>
    </linearGradient>

    <!-- Stem gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a7a3a"/>
      <stop offset="50%" stop-color="#5a8a48"/>
      <stop offset="100%" stop-color="#3d6830"/>
    </linearGradient>

    <!-- Leaf gradients -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a9048"/>
      <stop offset="40%" stop-color="#4d8040"/>
      <stop offset="100%" stop-color="#3a6530"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5f9550"/>
      <stop offset="50%" stop-color="#4a7a3a"/>
      <stop offset="100%" stop-color="#3a6228"/>
    </linearGradient>
    <linearGradient id="leafGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6a9a58"/>
      <stop offset="100%" stop-color="#3d7030"/>
    </linearGradient>

    <!-- Petal gradients - soft pink-lavender like references -->
    <linearGradient id="petalGrad1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d4a0c8"/>
      <stop offset="30%" stop-color="#c488b5"/>
      <stop offset="60%" stop-color="#b070a0"/>
      <stop offset="100%" stop-color="#8a4878"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#d898c0"/>
      <stop offset="35%" stop-color="#c580aa"/>
      <stop offset="70%" stop-color="#a86090"/>
      <stop offset="100%" stop-color="#884878"/>
    </linearGradient>
    <linearGradient id="petalGrad3" x1="70%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#cc90b8"/>
      <stop offset="40%" stop-color="#b87aa5"/>
      <stop offset="100%" stop-color="#905888"/>
    </linearGradient>
    <linearGradient id="petalGrad4" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#daa0c8"/>
      <stop offset="50%" stop-color="#c285b0"/>
      <stop offset="100%" stop-color="#9a5888"/>
    </linearGradient>

    <!-- Flower center gradient - warm orange-brown cone -->
    <radialGradient id="centerGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c87838"/>
      <stop offset="30%" stop-color="#b56828"/>
      <stop offset="60%" stop-color="#9a5020"/>
      <stop offset="100%" stop-color="#703818"/>
    </radialGradient>
    <radialGradient id="coneHighlight" cx="35%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#e09050" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b06828" stop-opacity="0"/>
    </radialGradient>

    <!-- Sepal gradient -->
    <linearGradient id="sepalGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5a8848"/>
      <stop offset="100%" stop-color="#3a6028"/>
    </linearGradient>

    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="50%" stop-color="#f5f0e5"/>
      <stop offset="100%" stop-color="#ece4d5"/>
    </radialGradient>

    <!-- Warm wash -->
    <radialGradient id="warmWash" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f8e8d0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f5ead8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background with paper texture -->
  <rect width="700" height="900" fill="url(#bgGrad)"/>
  <rect width="700" height="900" fill="url(#bgGrad)" filter="url(#paperTexture)" opacity="0.12"/>

  <!-- Subtle warm center wash -->
  <ellipse cx="340" cy="420" rx="300" ry="380" fill="url(#warmWash)" filter="url(#watercolorWash)"/>

  <!-- ============ STEMS ============ -->
  <g filter="url(#stemTexture)">
    <!-- Main stem -->
    <path d="M 345,530 C 343,570 341,630 337,690 C 333,745 327,795 322,850"
          fill="none" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 344,535 C 342,575 340,635 336,695 C 332,745 326,793 321,845"
          fill="none" stroke="#6a9a58" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

    <!-- Secondary stem - left flower bud -->
    <path d="M 339,660 C 330,668 305,688 275,705 C 255,716 235,722 218,725"
          fill="none" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Small branch right -->
    <path d="M 335,720 C 342,728 362,742 388,752"
          fill="none" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ============ LEAVES ============ -->
  <g filter="url(#leafTexture)">
    <!-- Large lower left leaf (lanceolate, echinacea-style) -->
    <path d="M 275,705 C 260,700 228,688 200,685 C 178,683 158,690 150,705
             C 145,716 150,728 165,730 C 185,732 218,720 250,708 C 265,702 275,700 275,705 Z"
          fill="url(#leafGrad1)" opacity="0.88"/>
    <!-- Central vein -->
    <path d="M 273,704 C 248,698 215,690 185,698 C 170,702 156,712 152,710"
          fill="none" stroke="#3a6530" stroke-width="1.2" opacity="0.6"/>
    <!-- Side veins - natural angles -->
    <path d="M 248,698 C 242,690 236,682" fill="none" stroke="#3a6530" stroke-width="0.6" opacity="0.4"/>
    <path d="M 230,694 C 222,686 216,678" fill="none" stroke="#3a6530" stroke-width="0.6" opacity="0.4"/>
    <path d="M 212,694 C 206,686 200,680" fill="none" stroke="#3a6530" stroke-width="0.6" opacity="0.35"/>
    <path d="M 195,698 C 190,690 186,684" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.3"/>
    <path d="M 235,698 C 228,710 222,720" fill="none" stroke="#3a6530" stroke-width="0.6" opacity="0.35"/>
    <path d="M 215,700 C 208,712 204,720" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.3"/>
    <path d="M 195,702 C 190,714 186,722" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.3"/>

    <!-- Lower right leaf -->
    <path d="M 388,752 C 405,746 438,732 462,728 C 482,725 502,732 510,745
             C 515,754 508,766 492,766 C 472,766 440,755 415,748 C 400,744 390,750 388,752 Z"
          fill="url(#leafGrad2)" opacity="0.88"/>
    <path d="M 390,750 C 418,744 455,734 486,742 C 500,746 508,755 510,750"
          fill="none" stroke="#3a6530" stroke-width="1.1" opacity="0.6"/>
    <path d="M 420,742 L 430,732" fill="none" stroke="#3a6530" stroke-width="0.6" opacity="0.4"/>
    <path d="M 445,736 L 454,726" fill="none" stroke="#3a6530" stroke-width="0.6" opacity="0.4"/>
    <path d="M 468,733 L 476,724" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.35"/>
    <path d="M 442,740 L 450,752" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.35"/>
    <path d="M 465,738 L 472,750" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.3"/>

    <!-- Upper leaf near flower -->
    <path d="M 341,588 C 326,578 294,558 268,550 C 248,544 230,548 224,560
             C 220,568 226,580 240,582 C 262,584 300,576 328,582 C 338,584 341,588 341,588 Z"
          fill="url(#leafGrad1)" opacity="0.82"/>
    <path d="M 339,586 C 310,576 272,560 246,564 C 234,566 226,574 226,566"
          fill="none" stroke="#3a6530" stroke-width="0.8" opacity="0.5"/>
    <path d="M 308,572 L 300,562" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.35"/>
    <path d="M 285,566 L 276,556" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.35"/>
    <path d="M 288,570 L 282,580" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.3"/>

    <!-- Small opposite leaf -->
    <path d="M 344,618 C 356,610 380,594 400,590 C 414,587 426,594 428,604
             C 430,612 422,620 410,620 C 394,620 372,612 356,616 C 348,618 344,618 344,618 Z"
          fill="url(#leafGrad2)" opacity="0.78"/>
    <path d="M 346,617 C 370,608 402,596 420,600 C 426,602 428,608 428,604"
          fill="none" stroke="#3a6530" stroke-width="0.7" opacity="0.45"/>
    <path d="M 380,604 L 388,594" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.3"/>
    <path d="M 400,598 L 408,590" fill="none" stroke="#3a6530" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- ============ SECONDARY FLOWER (BUD) on left branch ============ -->
  <g filter="url(#watercolorStrong)">
    <!-- Bud sepals -->
    <path d="M 218,725 C 215,718 210,708 205,702 C 200,696 194,694 190,698
             C 187,702 190,710 196,718 C 203,726 212,730 218,725 Z"
          fill="url(#sepalGrad)" opacity="0.75"/>
    <path d="M 218,725 C 222,718 225,706 225,698 C 225,690 222,686 218,688
             C 214,690 213,700 214,710 C 215,718 217,724 218,725 Z"
          fill="url(#sepalGrad)" opacity="0.7"/>
    <!-- Small opening petals -->
    <path d="M 218,725 C 212,720 202,712 196,708 C 192,705 192,702 196,704
             C 200,706 208,714 215,722 Z"
          fill="#c888b0" opacity="0.6"/>
    <path d="M 218,725 C 224,720 232,710 236,704 C 238,700 238,698 235,700
             C 232,702 224,714 220,722 Z"
          fill="#c080a8" opacity="0.55"/>
    <path d="M 218,725 C 216,716 214,704 212,696 C 211,692 212,690 214,692
             C 216,694 217,708 218,720 Z"
          fill="#c890b5" opacity="0.5"/>
  </g>

  <!-- ============ MAIN FLOWER (ECHINACEA) ============ -->
  <g filter="url(#watercolorStrong)">
    <!-- Back petals - drooping ray petals with individual character -->
    <!-- Far left back petal -->
    <path d="M 306,522 C 296,535 272,570 254,596 C 242,614 234,628 236,634
             C 238,638 244,636 252,622 C 264,600 284,565 302,535 Z"
          fill="url(#petalGrad3)" opacity="0.65"/>
    <!-- Far right back petal -->
    <path d="M 394,522 C 404,535 428,570 446,596 C 458,614 466,628 464,634
             C 462,638 456,636 448,622 C 436,600 416,565 398,535 Z"
          fill="url(#petalGrad2)" opacity="0.65"/>

    <!-- Left side back petals -->
    <path d="M 316,520 C 304,535 278,572 260,600 C 248,618 242,632 246,636
             C 250,640 260,628 272,608 C 290,580 310,542 318,528 Z"
          fill="url(#petalGrad2)" opacity="0.72"/>
    <path d="M 294,518 C 278,530 248,558 228,580 C 214,598 206,612 210,618
             C 214,622 226,612 240,592 C 260,564 282,534 294,518 Z"
          fill="url(#petalGrad4)" opacity="0.68"/>

    <!-- Right side back petals -->
    <path d="M 384,520 C 396,535 422,572 440,600 C 452,618 458,632 454,636
             C 450,640 440,628 428,608 C 410,580 390,542 382,528 Z"
          fill="url(#petalGrad1)" opacity="0.72"/>
    <path d="M 406,518 C 422,530 452,558 472,580 C 486,598 494,612 490,618
             C 486,622 474,612 460,592 C 440,564 418,534 406,518 Z"
          fill="url(#petalGrad3)" opacity="0.68"/>

    <!-- Middle layer petals - slightly more visible -->
    <!-- Left-center -->
    <path d="M 332,524 C 324,542 308,580 296,610 C 288,628 284,642 290,646
             C 296,648 304,634 314,612 C 326,584 334,550 336,530 Z"
          fill="url(#petalGrad1)" opacity="0.78"/>
    <!-- Right-center -->
    <path d="M 368,524 C 376,542 392,580 404,610 C 412,628 416,642 410,646
             C 404,648 396,634 386,612 C 374,584 366,550 364,530 Z"
          fill="url(#petalGrad2)" opacity="0.78"/>

    <!-- Center front petal -->
    <path d="M 350,528 C 348,548 346,590 344,618 C 343,636 344,650 350,652
             C 356,650 357,636 356,618 C 354,590 352,548 350,528 Z"
          fill="url(#petalGrad4)" opacity="0.82"/>

    <!-- Petal vein details - subtle lines along petal lengths -->
    <g opacity="0.18" stroke="#7a3060" fill="none" stroke-width="0.5">
      <path d="M 350,535 C 349,560 347,600 346,630"/>
      <path d="M 334,528 C 322,555 308,595 296,625"/>
      <path d="M 366,528 C 378,555 392,595 404,625"/>
      <path d="M 318,522 C 300,548 274,588 256,610"/>
      <path d="M 382,522 C 400,548 426,588 444,610"/>
      <path d="M 296,520 C 278,540 252,574 234,598"/>
      <path d="M 404,520 C 422,540 448,574 466,598"/>
    </g>

    <!-- Extra dimension - very faint additional drooping petals for fullness -->
    <path d="M 280,516 C 262,528 230,556 212,578 C 200,592 195,604 200,608
             C 206,610 218,598 232,578 C 250,552 270,528 280,516 Z"
          fill="url(#petalGrad3)" opacity="0.5"/>
    <path d="M 420,516 C 438,528 470,556 488,578 C 500,592 505,604 500,608
             C 494,610 482,598 468,578 C 450,552 430,528 420,516 Z"
          fill="url(#petalGrad2)" opacity="0.5"/>
  </g>

  <!-- ============ FLOWER CENTER (CONE) ============ -->
  <g filter="url(#watercolor)">
    <!-- Cone base shadow -->
    <ellipse cx="350" cy="528" rx="52" ry="20" fill="#5a3518" opacity="0.25"/>

    <!-- Main cone shape - slightly domed -->
    <ellipse cx="350" cy="510" rx="50" ry="32" fill="url(#centerGrad)"/>

    <!-- 3D highlight -->
    <ellipse cx="342" cy="502" rx="32" ry="20" fill="url(#coneHighlight)"/>

    <!-- Cone texture - tiny floret bumps in rows -->
    <g opacity="0.55">
      <!-- Row 1 (top) -->
      <circle cx="332" cy="494" r="2.2" fill="#c87838"/>
      <circle cx="342" cy="492" r="2.2" fill="#d08545"/>
