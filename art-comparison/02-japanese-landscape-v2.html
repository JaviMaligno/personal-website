<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 - Minimalist Japanese Landscape (v2)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #2a2a2e;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", Georgia, serif;
  }

  .frame {
    background: #f7f3ef;
    padding: 24px 24px 12px 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  }

  svg {
    display: block;
  }

  .title {
    text-align: center;
    color: #8a7e74;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 10px 0 4px 0;
  }

  /* Falling petal animations — gentle drift with rotation */
  @keyframes fall1 {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0.9; }
    25%  { transform: translate(8px, 45px) rotate(50deg); opacity: 0.85; }
    50%  { transform: translate(-4px, 100px) rotate(120deg); opacity: 0.65; }
    75%  { transform: translate(10px, 170px) rotate(210deg); opacity: 0.4; }
    100% { transform: translate(3px, 260px) rotate(320deg); opacity: 0; }
  }
  @keyframes fall2 {
    0%   { transform: translate(0, 0) rotate(20deg); opacity: 0.85; }
    30%  { transform: translate(-10px, 55px) rotate(85deg); opacity: 0.78; }
    60%  { transform: translate(5px, 130px) rotate(180deg); opacity: 0.5; }
    100% { transform: translate(-7px, 270px) rotate(350deg); opacity: 0; }
  }
  @keyframes fall3 {
    0%   { transform: translate(0, 0) rotate(-10deg); opacity: 0.8; }
    35%  { transform: translate(12px, 65px) rotate(65deg); opacity: 0.68; }
    65%  { transform: translate(-8px, 145px) rotate(160deg); opacity: 0.4; }
    100% { transform: translate(9px, 240px) rotate(290deg); opacity: 0; }
  }
  @keyframes fall4 {
    0%   { transform: translate(0, 0) rotate(5deg); opacity: 0.75; }
    40%  { transform: translate(-6px, 60px) rotate(95deg); opacity: 0.62; }
    70%  { transform: translate(11px, 155px) rotate(200deg); opacity: 0.35; }
    100% { transform: translate(-4px, 280px) rotate(325deg); opacity: 0; }
  }
  @keyframes fall5 {
    0%   { transform: translate(0, 0) rotate(-20deg); opacity: 0.82; }
    20%  { transform: translate(7px, 35px) rotate(30deg); opacity: 0.75; }
    55%  { transform: translate(-9px, 110px) rotate(140deg); opacity: 0.48; }
    100% { transform: translate(5px, 250px) rotate(300deg); opacity: 0; }
  }

  .petal-fall-1  { animation: fall1 8s ease-in infinite; }
  .petal-fall-2  { animation: fall2 10s ease-in 1.5s infinite; }
  .petal-fall-3  { animation: fall3 9s ease-in 3s infinite; }
  .petal-fall-4  { animation: fall4 11s ease-in 0.5s infinite; }
  .petal-fall-5  { animation: fall5 12s ease-in 4s infinite; }
  .petal-fall-6  { animation: fall3 7.5s ease-in 2s infinite; }
  .petal-fall-7  { animation: fall2 9.5s ease-in 5s infinite; }
  .petal-fall-8  { animation: fall4 10.5s ease-in 3.5s infinite; }
  .petal-fall-9  { animation: fall1 11.5s ease-in 6s infinite; }
  .petal-fall-10 { animation: fall2 8.5s ease-in 1s infinite; }
  .petal-fall-11 { animation: fall5 10s ease-in 2.5s infinite; }
  .petal-fall-12 { animation: fall3 13s ease-in 7s infinite; }
  .petal-fall-13 { animation: fall1 9s ease-in 4.5s infinite; }
  .petal-fall-14 { animation: fall4 12s ease-in 0.8s infinite; }
  .petal-fall-15 { animation: fall2 11s ease-in 5.5s infinite; }
  .petal-fall-16 { animation: fall5 8s ease-in 3.2s infinite; }
  .petal-fall-17 { animation: fall3 10.5s ease-in 1.8s infinite; }
  .petal-fall-18 { animation: fall1 14s ease-in 6.5s infinite; }
</style>
</head>
<body>

<div class="frame">
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Sky gradient — warm at horizon fading to clean white above -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6f2"/>
      <stop offset="55%" stop-color="#f8f2ec"/>
      <stop offset="85%" stop-color="#f5ece3"/>
      <stop offset="100%" stop-color="#f0e5d9"/>
    </linearGradient>

    <!-- Warm horizon glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="78%" r="45%" fx="50%" fy="80%">
      <stop offset="0%" stop-color="#f5ddd0" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#f2ddd2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0e5d9" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fef5ec" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f0e8df" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain gradients — grey tones for depth -->
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8c0b8"/>
      <stop offset="100%" stop-color="#d8d0c8"/>
    </linearGradient>

    <linearGradient id="mountainMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b0a8"/>
      <stop offset="100%" stop-color="#ccc4bc"/>
    </linearGradient>

    <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8a098"/>
      <stop offset="100%" stop-color="#c0b8b0"/>
    </linearGradient>

    <!-- Pink-tinted distant mountain layer (Flux-inspired) -->
    <linearGradient id="mountainPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c8c4"/>
      <stop offset="100%" stop-color="#e0d4d0"/>
    </linearGradient>

    <!-- Hill gradient -->
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8078"/>
      <stop offset="100%" stop-color="#9e9488"/>
    </linearGradient>

    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a9088"/>
      <stop offset="100%" stop-color="#aea498"/>
    </linearGradient>

    <!-- Mist gradients -->
    <linearGradient id="mist1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0e8e0" stop-opacity="0"/>
      <stop offset="20%" stop-color="#f0e8e0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f0e8e0" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#f0e8e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0e8e0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="mist2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4ece4" stop-opacity="0"/>
      <stop offset="15%" stop-color="#f4ece4" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#f4ece4" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#f4ece4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f4ece4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="mist3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ece4dc" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ece4dc" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ece4dc" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ece4dc" stop-opacity="0"/>
    </linearGradient>

    <!-- Trunk gradients — darker, organic -->
    <linearGradient id="trunkMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d332a"/>
      <stop offset="35%" stop-color="#4a3e34"/>
      <stop offset="65%" stop-color="#56483c"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>

    <linearGradient id="trunkHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a3e34" stop-opacity="0"/>
      <stop offset="40%" stop-color="#6b5e52" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a3e34" stop-opacity="0"/>
    </linearGradient>

    <!-- Blossom gradients -->
    <radialGradient id="blossomPink" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f4c8ca"/>
      <stop offset="50%" stop-color="#e8adb0"/>
      <stop offset="100%" stop-color="#dfa0a4"/>
    </radialGradient>

    <radialGradient id="blossomLight" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fce4e5"/>
      <stop offset="50%" stop-color="#f4cfd1"/>
      <stop offset="100%" stop-color="#eabcbf"/>
    </radialGradient>

    <radialGradient id="blossomDeep" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8b0b3"/>
      <stop offset="60%" stop-color="#d9969a"/>
      <stop offset="100%" stop-color="#cf8a8e"/>
    </radialGradient>

    <radialGradient id="blossomSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8dfe0"/>
      <stop offset="100%" stop-color="#eec4c7" stop-opacity="0.6"/>
    </radialGradient>

    <radialGradient id="blossomWhite" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fef0f0"/>
      <stop offset="60%" stop-color="#f6dada"/>
      <stop offset="100%" stop-color="#ecc8cb"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="softBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <filter id="gentleBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>

    <filter id="veryGentleBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8"/>
    </filter>

    <filter id="moonBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>

    <filter id="mistBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>

    <!-- Petal shapes for falling animation -->
    <g id="petalShape">
      <ellipse cx="0" cy="0" rx="3.5" ry="2.2" fill="#e8adb0" opacity="0.8"
               transform="rotate(-15)"/>
    </g>
    <g id="petalShape2">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#f2c6c8" opacity="0.75"
               transform="rotate(10)"/>
    </g>
    <g id="petalShape3">
      <ellipse cx="0" cy="0" rx="2.8" ry="1.8" fill="#dfa0a4" opacity="0.7"
               transform="rotate(-5)"/>
    </g>
    <g id="petalShape4">
      <ellipse cx="0" cy="0" rx="3.2" ry="1.9" fill="#f4cfd1" opacity="0.72"
               transform="rotate(20)"/>
    </g>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Warm horizon glow — subtle warmth near horizon line -->
  <rect width="800" height="600" fill="url(#horizonGlow)"/>

  <!-- ===== MOON — upper right, generous negative space ===== -->
  <circle cx="630" cy="100" r="55" fill="url(#moonGlow)" filter="url(#moonBlur)" opacity="0.5"/>
  <circle cx="630" cy="100" r="26" fill="#fef8f2" opacity="0.85"/>
  <circle cx="630" cy="100" r="26" fill="none" stroke="#ede0d4" stroke-width="0.5" opacity="0.35"/>

  <!-- ===== MOUNTAINS — layered grey with subtle pink tint ===== -->

  <!-- Furthest mountains — very faint, pink-grey (Flux-inspired) -->
  <path d="M-20,395 Q40,340 120,360 Q180,315 260,345 Q320,295 400,325
           Q460,290 540,315 Q600,280 680,305 Q740,288 820,310 L820,410 L-20,410 Z"
        fill="url(#mountainPink)" opacity="0.35"/>

  <!-- Far mountains — pale grey, hint of peaks -->
  <path d="M-20,400 Q60,335 140,365 Q200,318 280,348 Q360,300 440,330
           Q520,295 600,320 Q670,290 750,315 Q800,305 820,318 L820,415 L-20,415 Z"
        fill="url(#mountainFar)" opacity="0.4"/>

  <!-- Mist layer 1 -->
  <rect x="0" y="355" width="800" height="45" fill="url(#mist1)" filter="url(#mistBlur)"/>

  <!-- Mid mountains -->
  <path d="M-20,415 Q50,375 130,395 Q200,365 280,385
           Q350,355 430,375 Q510,358 590,380
           Q660,362 740,385 Q790,375 820,388 L820,435 L-20,435 Z"
        fill="url(#mountainMid)" opacity="0.5"/>

  <!-- Mist layer 2 -->
  <rect x="-20" y="390" width="840" height="35" fill="url(#mist2)" filter="url(#mistBlur)"/>

  <!-- Near foothills -->
  <path d="M-20,440 Q70,408 170,425 Q250,405 340,420
           Q420,400 510,418 Q590,404 690,420 Q760,412 820,425 L820,460 L-20,460 Z"
        fill="url(#mountainNear)" opacity="0.45"/>

  <!-- Mist layer 3 — thin -->
  <rect x="0" y="420" width="800" height="28" fill="url(#mist3)" filter="url(#softBlur)"/>

  <!-- ===== HILL — gentle, expansive ===== -->
  <ellipse cx="380" cy="560" rx="380" ry="130" fill="url(#hill)" opacity="0.82"/>

  <!-- Ground plane -->
  <rect x="0" y="530" width="800" height="70" fill="url(#ground)" opacity="0.65"/>

  <!-- ===== CHERRY BLOSSOM TREE ===== -->
  <!-- The tree is the emotional center: positioned slightly right of the hill crest,
       with a thick trunk that curves organically, branching naturally into an
       asymmetric canopy that leans gently to the right -->

  <g id="tree">
    <!-- ---- TRUNK ---- -->
    <!-- Main trunk — thick at base, with natural organic curve like Gemini/Flux references -->
    <!-- Base section — widest -->
    <path d="M385,530 Q383,515 380,500 Q376,480 374,462 Q372,445 374,428
             Q377,412 382,398 Q387,385 392,372"
          fill="none" stroke="url(#trunkMain)" stroke-width="14" stroke-linecap="round"/>
    <!-- Mid section taper -->
    <path d="M385,530 Q383,515 380,500 Q376,480 374,462 Q372,445 374,428
             Q377,412 382,398 Q387,385 392,372"
          fill="none" stroke="url(#trunkMain)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <!-- Upper trunk continuing to first major fork -->
    <path d="M392,372 Q396,358 400,345 Q404,332 406,322"
          fill="none" stroke="url(#trunkMain)" stroke-width="8" stroke-linecap="round"/>
    <!-- Slight bark texture highlight -->
    <path d="M385,530 Q383,515 380,500 Q376,480 374,462 Q372,445 374,428"
          fill="none" stroke="url(#trunkHighlight)" stroke-width="6" stroke-linecap="round"/>

    <!-- ---- MAJOR BRANCHES ---- -->

    <!-- RIGHT MAIN BRANCH — sweeping arc to the right (dominant side) -->
    <path d="M388,395 Q405,380 430,368 Q460,355 492,348 Q518,344 540,346"
          fill="none" stroke="#453929" stroke-width="6" stroke-linecap="round"/>
    <!-- Continuation / sub-branch curving up-right -->
    <path d="M492,348 Q510,340 528,330 Q542,322 552,316"
          fill="none" stroke="#453929" stroke-width="4" stroke-linecap="round"/>
    <!-- Sub-branch dropping down-right -->
    <path d="M470,355 Q488,360 505,368 Q518,375 526,380"
          fill="none" stroke="#4a3e34" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Sub-branch up from mid-right -->
    <path d="M445,362 Q455,352 462,340 Q468,330 470,322"
          fill="none" stroke="#4a3e34" stroke-width="3" stroke-linecap="round"/>

    <!-- RIGHT UPPER BRANCH — arcing up and right -->
    <path d="M400,350 Q418,335 438,322 Q455,312 470,306"
          fill="none" stroke="#453929" stroke-width="5" stroke-linecap="round"/>
    <!-- Sub-branch from upper right -->
    <path d="M450,316 Q462,308 475,298 Q484,292 490,288"
          fill="none" stroke="#4a3e34" stroke-width="3" stroke-linecap="round"/>
    <!-- Small twig up -->
    <path d="M438,322 Q442,310 445,300"
          fill="none" stroke="#5a4e44" stroke-width="2" stroke-linecap="round"/>

    <!-- TOP BRANCH — reaching upward (Gemini-inspired vertical reach) -->
    <path d="M406,322 Q410,305 415,290 Q420,278 425,268"
          fill="none" stroke="#453929" stroke-width="5" stroke-linecap="round"/>
    <!-- Top fork right -->
    <path d="M418,285 Q428,275 440,268 Q450,262 458,260"
          fill="none" stroke="#4a3e34" stroke-width="3" stroke-linecap="round"/>
    <!-- Top fork left -->
    <path d="M415,290 Q408,278 400,270 Q394,264 390,260"
          fill="none" stroke="#4a3e34" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Top tip -->
    <path d="M425,268 Q428,258 430,248"
          fill="none" stroke="#5a4e44" stroke-width="2" stroke-linecap="round"/>

    <!-- LEFT MAIN BRANCH — sweeping to the left (shorter, for asymmetry) -->
    <path d="M380,405 Q362,392 342,382 Q322,374 305,370 Q290,367 278,368"
          fill="none" stroke="#453929" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Left sub-branch upward -->
    <path d="M325,376 Q315,365 308,355 Q302,346 300,340"
          fill="none" stroke="#4a3e34" stroke-width="3" stroke-linecap="round"/>
    <!-- Left sub-branch downward/out -->
    <path d="M305,370 Q292,375 280,382 Q270,388 264,392"
          fill="none" stroke="#4a3e34" stroke-width="2.5" stroke-linecap="round"/>

    <!-- LEFT UPPER BRANCH -->
    <path d="M390,375 Q375,362 358,352 Q342,344 328,340"
          fill="none" stroke="#453929" stroke-width="4" stroke-linecap="round"/>
    <!-- Sub-branch from left upper -->
    <path d="M348,348 Q338,338 330,328 Q324,320 322,314"
          fill="none" stroke="#4a3e34" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ---- DELICATE TWIGS ---- -->
    <!-- Right side twigs -->
    <path d="M535,346 Q548,342 558,336" fill="none" stroke="#5a4e44" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M540,346 Q548,354 555,360" fill="none" stroke="#5a4e44" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M550,318 Q560,312 568,308" fill="none" stroke="#5a4e44" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M526,332 Q535,325 542,318" fill="none" stroke="#5a4e44" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M524,380 Q532,385 538,392" fill="none" stroke="#5a4e44" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M508,370 Q518,378 524,384" fill="none" stroke="#5a4e44" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M488,290 Q496,284 502,278" fill="none" stroke="#5a4e44" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M470,306 Q478,300 484,292" fill="none" stroke="#5a4e44" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M468,322 Q475,315 480,308" fill="none" stroke="#5a4e44" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M445,300 Q452,292 456,284" fill="none" stroke="#5a4e44" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M460,260 Q468,254 474,250" fill="none" stroke="#5a4e44" stroke-width="1" stroke-linecap="round"/>
    <path d="M430,248 Q434,240 436,234" fill="none" stroke="#5a4e44" stroke-width="1" stroke-linecap="round"/>

    <!-- Left side twigs -->
    <path d="M278,368 Q268,362 260,356" fill="none" stroke="#5a4e44" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M280,368 Q272,374 266,380" fill="none" stroke="#5a4e44" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M300,340 Q292,334 286,328" fill="none" stroke="#5a4e44" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M328,340 Q320,332 314,325" fill="none" stroke="#5a4e44" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M322,314 Q316,306 312,300" fill="none" stroke="#5a4e44" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M264,392 Q256,398 250,404" fill="none" stroke="#5a4e44" stroke-width="1" stroke-linecap="round"/>
    <path d="M390,260 Q384,254 380,248" fill="none" stroke="#5a4e44" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M400,270 Q394,262 388,256" fill="none" stroke="#5a4e44" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- ===== BLOSSOM CLUSTERS ===== -->
  <!-- Soft cloud-like clusters: a mix of blurred background masses and crisper foreground blossoms -->

  <!-- LAYER 1: Large soft background masses (heavily blurred) — gives depth/volume -->
  <g filter="url(#softBlur)" opacity="0.55">
    <!-- Right canopy mass -->
    <circle cx="500" cy="340" r="32" fill="url(#blossomSoft)"/>
    <circle cx="540" cy="335" r="26" fill="url(#blossomSoft)"/>
    <circle cx="465" cy="330" r="28" fill="url(#blossomSoft)"/>
    <circle cx="525" cy="360" r="22" fill="url(#blossomSoft)"/>
    <!-- Upper right mass -->
    <circle cx="470" cy="298" r="24" fill="url(#blossomSoft)"/>
    <circle cx="450" cy="268" r="20" fill="url(#blossomSoft)"/>
    <!-- Top mass -->
    <circle cx="425" cy="258" r="18" fill="url(#blossomSoft)"/>
    <circle cx="410" cy="275" r="20" fill="url(#blossomSoft)"/>
    <!-- Left canopy mass -->
    <circle cx="310" cy="350" r="24" fill="url(#blossomSoft)"/>
    <circle cx="285" cy="365" r="20" fill="url(#blossomSoft)"/>
    <circle cx="340" cy="338" r="18" fill="url(#blossomSoft)"/>
    <circle cx="320" cy="320" r="16" fill="url(#blossomSoft)"/>
  </g>

  <!-- LAYER 2: Medium clusters (gently blurred) -->
  <g filter="url(#gentleBlur)">
    <!-- === RIGHT MAIN BRANCH clusters === -->
    <!-- Cluster at end of right main branch -->
    <circle cx="538" cy="342" r="14" fill="url(#blossomPink)" opacity="0.78"/>
    <circle cx="550" cy="338" r="11" fill="url(#blossomLight)" opacity="0.72"/>
    <circle cx="558" cy="334" r="9" fill="url(#blossomPink)" opacity="0.65"/>
    <circle cx="544" cy="350" r="10" fill="url(#blossomDeep)" opacity="0.6"/>
    <circle cx="555" cy="358" r="8" fill="url(#blossomLight)" opacity="0.55"/>

    <!-- Mid-right cluster -->
    <circle cx="498" cy="345" r="13" fill="url(#blossomLight)" opacity="0.8"/>
