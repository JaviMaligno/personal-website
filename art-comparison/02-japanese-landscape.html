<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 - Minimalist Japanese Landscape</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #2a2a2e;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", Georgia, serif;
  }

  .frame {
    background: #f7f3ef;
    padding: 24px 24px 12px 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  }

  svg {
    display: block;
  }

  .title {
    text-align: center;
    color: #8a7e74;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 10px 0 4px 0;
  }

  /* Falling petal animations */
  @keyframes fall1 {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0.9; }
    25%  { transform: translate(6px, 40px) rotate(45deg); opacity: 0.85; }
    50%  { transform: translate(-3px, 90px) rotate(110deg); opacity: 0.7; }
    75%  { transform: translate(8px, 150px) rotate(200deg); opacity: 0.5; }
    100% { transform: translate(2px, 220px) rotate(300deg); opacity: 0; }
  }
  @keyframes fall2 {
    0%   { transform: translate(0, 0) rotate(20deg); opacity: 0.85; }
    30%  { transform: translate(-8px, 50px) rotate(80deg); opacity: 0.8; }
    60%  { transform: translate(4px, 120px) rotate(170deg); opacity: 0.55; }
    100% { transform: translate(-5px, 240px) rotate(340deg); opacity: 0; }
  }
  @keyframes fall3 {
    0%   { transform: translate(0, 0) rotate(-10deg); opacity: 0.8; }
    35%  { transform: translate(10px, 60px) rotate(60deg); opacity: 0.7; }
    65%  { transform: translate(-6px, 130px) rotate(150deg); opacity: 0.45; }
    100% { transform: translate(7px, 210px) rotate(280deg); opacity: 0; }
  }
  @keyframes fall4 {
    0%   { transform: translate(0, 0) rotate(5deg); opacity: 0.75; }
    40%  { transform: translate(-5px, 55px) rotate(90deg); opacity: 0.65; }
    70%  { transform: translate(9px, 140px) rotate(190deg); opacity: 0.4; }
    100% { transform: translate(-3px, 250px) rotate(310deg); opacity: 0; }
  }

  .petal-fall-1 { animation: fall1 8s ease-in infinite; }
  .petal-fall-2 { animation: fall2 10s ease-in 1.5s infinite; }
  .petal-fall-3 { animation: fall3 9s ease-in 3s infinite; }
  .petal-fall-4 { animation: fall4 11s ease-in 0.5s infinite; }
  .petal-fall-5 { animation: fall1 12s ease-in 4s infinite; }
  .petal-fall-6 { animation: fall3 7.5s ease-in 2s infinite; }
  .petal-fall-7 { animation: fall2 9.5s ease-in 5s infinite; }
  .petal-fall-8 { animation: fall4 10.5s ease-in 3.5s infinite; }
  .petal-fall-9 { animation: fall1 11.5s ease-in 6s infinite; }
  .petal-fall-10 { animation: fall2 8.5s ease-in 1s infinite; }
</style>
</head>
<body>

<div class="frame">
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Sky gradient - warm parchment tone -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e8df"/>
      <stop offset="40%" stop-color="#f5ede4"/>
      <stop offset="100%" stop-color="#ece3d8"/>
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fef5ec" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f0e8df" stop-opacity="0"/>
    </radialGradient>

    <!-- Distant mountain gradient -->
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5bab0"/>
      <stop offset="100%" stop-color="#d4cac0"/>
    </linearGradient>

    <!-- Mid mountain gradient -->
    <linearGradient id="mountainMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8ada3"/>
      <stop offset="100%" stop-color="#cbc1b7"/>
    </linearGradient>

    <!-- Near mountain gradient -->
    <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a89e94"/>
      <stop offset="100%" stop-color="#bfb5ab"/>
    </linearGradient>

    <!-- Hill gradient -->
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7e72"/>
      <stop offset="100%" stop-color="#9e9286"/>
    </linearGradient>

    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e9286"/>
      <stop offset="100%" stop-color="#b0a498"/>
    </linearGradient>

    <!-- Mist gradients -->
    <linearGradient id="mist1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ece3d8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ece3d8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ece3d8" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#ece3d8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ece3d8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="mist2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0e8df" stop-opacity="0"/>
      <stop offset="15%" stop-color="#f0e8df" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#f0e8df" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#f0e8df" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f0e8df" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="mist3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ece3d8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ece3d8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ece3d8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ece3d8" stop-opacity="0"/>
    </linearGradient>

    <!-- Trunk gradient -->
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a4e44"/>
      <stop offset="50%" stop-color="#6b5e52"/>
      <stop offset="100%" stop-color="#4e4238"/>
    </linearGradient>

    <!-- Blossom cluster gradient -->
    <radialGradient id="blossomPink" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f2c6c8"/>
      <stop offset="50%" stop-color="#e8adb0"/>
      <stop offset="100%" stop-color="#dfa0a4"/>
    </radialGradient>

    <radialGradient id="blossomLight" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fce4e5"/>
      <stop offset="50%" stop-color="#f4cfd1"/>
      <stop offset="100%" stop-color="#eabcbf"/>
    </radialGradient>

    <radialGradient id="blossomDeep" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8b0b3"/>
      <stop offset="60%" stop-color="#d9969a"/>
      <stop offset="100%" stop-color="#cf8a8e"/>
    </radialGradient>

    <!-- Soft blur filter for mist -->
    <filter id="softBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <filter id="gentleBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>

    <!-- Very soft glow for moon -->
    <filter id="moonBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>

    <!-- Petal shape -->
    <g id="petalShape">
      <ellipse cx="0" cy="0" rx="3.5" ry="2.2" fill="#e8adb0" opacity="0.8"
               transform="rotate(-15)"/>
    </g>

    <g id="petalShape2">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#f2c6c8" opacity="0.75"
               transform="rotate(10)"/>
    </g>

    <g id="petalShape3">
      <ellipse cx="0" cy="0" rx="2.8" ry="1.8" fill="#dfa0a4" opacity="0.7"
               transform="rotate(-5)"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Moon - upper right area with generous negative space -->
  <circle cx="620" cy="110" r="50" fill="url(#moonGlow)" filter="url(#moonBlur)" opacity="0.6"/>
  <circle cx="620" cy="110" r="28" fill="#fef8f2" opacity="0.9"/>
  <circle cx="620" cy="110" r="28" fill="none" stroke="#ede0d4" stroke-width="0.5" opacity="0.4"/>

  <!-- Far distant mountains - very pale, barely there -->
  <path d="M0,380 Q80,310 160,340 Q220,300 300,320 Q380,280 460,310
           Q520,270 580,295 Q650,260 720,290 Q770,275 800,300 L800,400 L0,400 Z"
        fill="url(#mountainFar)" opacity="0.5"/>

  <!-- Mist layer 1 - between far and mid mountains -->
  <rect x="0" y="340" width="800" height="40" fill="url(#mist1)" filter="url(#softBlur)"/>

  <!-- Mid mountains -->
  <path d="M-20,400 Q60,345 140,370 Q200,340 280,358
           Q350,325 430,350 Q510,330 590,355
           Q660,335 740,360 Q790,348 820,365 L820,420 L-20,420 Z"
        fill="url(#mountainMid)" opacity="0.6"/>

  <!-- Mist layer 2 -->
  <rect x="-20" y="370" width="840" height="35" fill="url(#mist2)" filter="url(#softBlur)"/>

  <!-- Near mountains / foothills -->
  <path d="M-20,430 Q80,385 180,405 Q260,380 350,400
           Q430,375 520,395 Q600,378 700,398 Q760,388 820,400 L820,450 L-20,450 Z"
        fill="url(#mountainNear)" opacity="0.55"/>

  <!-- Mist layer 3 - lowest, thinnest -->
  <rect x="0" y="405" width="800" height="30" fill="url(#mist3)" filter="url(#softBlur)"/>

  <!-- Gentle hill -->
  <ellipse cx="340" cy="540" rx="320" ry="110" fill="url(#hill)" opacity="0.85"/>

  <!-- Ground plane -->
  <rect x="0" y="520" width="800" height="80" fill="url(#ground)" opacity="0.7"/>

  <!-- === Cherry Blossom Tree === -->
  <!-- Tree trunk - graceful curve, slightly left of hill center for asymmetry -->
  <g>
    <!-- Main trunk -->
    <path d="M310,520 Q308,490 305,465 Q300,440 298,420 Q296,400 300,380
             Q305,360 310,345 Q315,332 318,320"
          fill="none" stroke="url(#trunk)" stroke-width="8" stroke-linecap="round"/>

    <!-- Trunk taper - thinner at top -->
    <path d="M310,520 Q308,490 305,465 Q300,440 298,420 Q296,400 300,380
             Q305,360 310,345 Q315,332 318,320"
          fill="none" stroke="url(#trunk)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Main branch - right, sweeping -->
    <path d="M305,400 Q320,385 340,375 Q365,362 390,355 Q410,350 425,352"
          fill="none" stroke="#5a4e44" stroke-width="4" stroke-linecap="round"/>

    <!-- Secondary branch - right upper -->
    <path d="M312,370 Q325,358 345,348 Q360,340 375,338"
          fill="none" stroke="#5a4e44" stroke-width="3" stroke-linecap="round"/>

    <!-- Branch - left -->
    <path d="M302,395 Q285,380 268,372 Q250,365 235,363"
          fill="none" stroke="#5a4e44" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Small branch - left upper -->
    <path d="M308,360 Q295,348 278,342 Q265,338 255,340"
          fill="none" stroke="#5a4e44" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Top branch - upward -->
    <path d="M318,320 Q322,308 328,298 Q335,290 340,285"
          fill="none" stroke="#5a4e44" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Small twig - top right -->
    <path d="M328,298 Q340,292 352,290"
          fill="none" stroke="#5a4e44" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Small twig - top left -->
    <path d="M322,308 Q312,300 305,298"
          fill="none" stroke="#5a4e44" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Twig from right main branch -->
    <path d="M370,360 Q378,350 385,342"
          fill="none" stroke="#5a4e44" stroke-width="1.5" stroke-linecap="round"/>

    <path d="M400,353 Q408,345 412,338"
          fill="none" stroke="#5a4e44" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Twig from left branch -->
    <path d="M258,368 Q250,358 248,350"
          fill="none" stroke="#5a4e44" stroke-width="1.5" stroke-linecap="round"/>

    <path d="M275,370 Q270,360 272,352"
          fill="none" stroke="#5a4e44" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Delicate sub-branches right -->
    <path d="M415,352 Q425,348 432,342"
          fill="none" stroke="#6b5e52" stroke-width="1" stroke-linecap="round"/>

    <path d="M390,355 Q395,362 400,366"
          fill="none" stroke="#6b5e52" stroke-width="1" stroke-linecap="round"/>

    <!-- Delicate sub-branch left -->
    <path d="M240,363 Q232,358 228,352"
          fill="none" stroke="#6b5e52" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- === Blossom clusters === -->
  <!-- Blossoms are soft, cloud-like groupings along branches -->
  <g filter="url(#gentleBlur)">
    <!-- Right main branch cluster 1 -->
    <circle cx="395" cy="348" r="14" fill="url(#blossomPink)" opacity="0.8"/>
    <circle cx="408" cy="345" r="11" fill="url(#blossomLight)" opacity="0.75"/>
    <circle cx="420" cy="348" r="13" fill="url(#blossomPink)" opacity="0.7"/>
    <circle cx="430" cy="343" r="9" fill="url(#blossomLight)" opacity="0.65"/>

    <!-- Right main branch cluster 2 -->
    <circle cx="365" cy="358" r="12" fill="url(#blossomLight)" opacity="0.8"/>
    <circle cx="375" cy="353" r="10" fill="url(#blossomPink)" opacity="0.75"/>
    <circle cx="385" cy="342" r="8" fill="url(#blossomDeep)" opacity="0.6"/>

    <!-- Right upper branch cluster -->
    <circle cx="350" cy="342" r="11" fill="url(#blossomPink)" opacity="0.75"/>
    <circle cx="362" cy="338" r="10" fill="url(#blossomLight)" opacity="0.7"/>
    <circle cx="372" cy="335" r="8" fill="url(#blossomPink)" opacity="0.65"/>

    <!-- Top cluster -->
    <circle cx="335" cy="288" r="10" fill="url(#blossomLight)" opacity="0.8"/>
    <circle cx="345" cy="285" r="8" fill="url(#blossomPink)" opacity="0.7"/>
    <circle cx="350" cy="290" r="7" fill="url(#blossomDeep)" opacity="0.6"/>

    <!-- Top-left twig cluster -->
    <circle cx="308" cy="296" r="8" fill="url(#blossomPink)" opacity="0.7"/>
    <circle cx="302" cy="293" r="6" fill="url(#blossomLight)" opacity="0.65"/>

    <!-- Top upward cluster -->
    <circle cx="328" cy="300" r="9" fill="url(#blossomPink)" opacity="0.75"/>
    <circle cx="320" cy="305" r="7" fill="url(#blossomLight)" opacity="0.7"/>

    <!-- Left branch cluster 1 -->
    <circle cx="248" cy="360" r="12" fill="url(#blossomPink)" opacity="0.75"/>
    <circle cx="238" cy="358" r="10" fill="url(#blossomLight)" opacity="0.8"/>
    <circle cx="230" cy="355" r="8" fill="url(#blossomDeep)" opacity="0.6"/>

    <!-- Left branch cluster 2 -->
    <circle cx="268" cy="365" r="10" fill="url(#blossomLight)" opacity="0.7"/>
    <circle cx="278" cy="360" r="9" fill="url(#blossomPink)" opacity="0.75"/>

    <!-- Left upper twig cluster -->
    <circle cx="258" cy="342" r="9" fill="url(#blossomPink)" opacity="0.7"/>
    <circle cx="250" cy="346" r="7" fill="url(#blossomLight)" opacity="0.65"/>
    <circle cx="248" cy="350" r="6" fill="url(#blossomDeep)" opacity="0.55"/>

    <!-- Left twig end cluster -->
    <circle cx="272" cy="350" r="7" fill="url(#blossomPink)" opacity="0.65"/>

    <!-- Small accent cluster mid-trunk -->
    <circle cx="302" cy="378" r="6" fill="url(#blossomLight)" opacity="0.5"/>

    <!-- Right sub-branch end cluster -->
    <circle cx="410" cy="336" r="7" fill="url(#blossomLight)" opacity="0.6"/>
    <circle cx="400" cy="365" r="6" fill="url(#blossomPink)" opacity="0.55"/>
  </g>

  <!-- === Individual blossoms (unblurred, sharper detail) === -->
  <!-- Small five-petal flowers scattered for detail -->
  <g opacity="0.7">
    <!-- Flower 1 -->
    <g transform="translate(425, 340)">
      <ellipse cx="-3" cy="-2" rx="2.5" ry="1.8" fill="#f2c6c8" transform="rotate(-30)"/>
      <ellipse cx="3" cy="-2" rx="2.5" ry="1.8" fill="#f2c6c8" transform="rotate(30)"/>
      <ellipse cx="4" cy="2" rx="2.5" ry="1.8" fill="#eabcbf" transform="rotate(80)"/>
      <ellipse cx="-4" cy="2" rx="2.5" ry="1.8" fill="#eabcbf" transform="rotate(-80)"/>
      <ellipse cx="0" cy="4" rx="2.5" ry="1.8" fill="#f2c6c8"/>
      <circle cx="0" cy="0.5" r="1.2" fill="#d4898d" opacity="0.6"/>
    </g>

    <!-- Flower 2 -->
    <g transform="translate(240, 352) scale(0.85)">
      <ellipse cx="-3" cy="-2" rx="2.5" ry="1.8" fill="#fce4e5" transform="rotate(-30)"/>
      <ellipse cx="3" cy="-2" rx="2.5" ry="1.8" fill="#fce4e5" transform="rotate(30)"/>
      <ellipse cx="4" cy="2" rx="2.5" ry="1.8" fill="#f4cfd1" transform="rotate(80)"/>
      <ellipse cx="-4" cy="2" rx="2.5" ry="1.8" fill="#f4cfd1" transform="rotate(-80)"/>
      <ellipse cx="0" cy="4" rx="2.5" ry="1.8" fill="#fce4e5"/>
      <circle cx="0" cy="0.5" r="1.2" fill="#d4898d" opacity="0.6"/>
    </g>

    <!-- Flower 3 -->
    <g transform="translate(355, 332) scale(0.8)">
      <ellipse cx="-3" cy="-2" rx="2.5" ry="1.8" fill="#f2c6c8" transform="rotate(-20)"/>
      <ellipse cx="3" cy="-2" rx="2.5" ry="1.8" fill="#f2c6c8" transform="rotate(40)"/>
      <ellipse cx="4" cy="2" rx="2.5" ry="1.8" fill="#eabcbf" transform="rotate(90)"/>
      <ellipse cx="-4" cy="2" rx="2.5" ry="1.8" fill="#eabcbf" transform="rotate(-70)"/>
      <ellipse cx="0" cy="4" rx="2.5" ry="1.8" fill="#f2c6c8"/>
      <circle cx="0" cy="0.5" r="1.2" fill="#cf8a8e" opacity="0.5"/>
    </g>

    <!-- Flower 4 - at top -->
    <g transform="translate(340, 280) scale(0.75)">
      <ellipse cx="-3" cy="-2" rx="2.5" ry="1.8" fill="#fce4e5" transform="rotate(-25)"/>
      <ellipse cx="3" cy="-2" rx="2.5" ry="1.8" fill="#fce4e5" transform="rotate(35)"/>
      <ellipse cx="4" cy="2" rx="2.5" ry="1.8" fill="#f4cfd1" transform="rotate(85)"/>
      <ellipse cx="-4" cy="2" rx="2.5" ry="1.8" fill="#f4cfd1" transform="rotate(-75)"/>
      <ellipse cx="0" cy="4" rx="2.5" ry="1.8" fill="#fce4e5"/>
      <circle cx="0" cy="0.5" r="1.2" fill="#d4898d" opacity="0.5"/>
    </g>
  </g>

  <!-- === Falling petals (animated) === -->
  <!-- Each petal starts near the tree and drifts downward -->
  <use href="#petalShape" x="380" y="360" class="petal-fall-1"/>
  <use href="#petalShape2" x="350" y="340" class="petal-fall-2"/>
  <use href="#petalShape3" x="290" y="355" class="petal-fall-3"/>
  <use href="#petalShape" x="410" y="350" class="petal-fall-4"/>
  <use href="#petalShape2" x="260" y="365" class="petal-fall-5"/>
  <use href="#petalShape3" x="330" y="310" class="petal-fall-6"/>
  <use href="#petalShape" x="365" y="345" class="petal-fall-7"/>
  <use href="#petalShape2" x="310" y="330" class="petal-fall-8"/>
  <use href="#petalShape3" x="395" y="355" class="petal-fall-9"/>
  <use href="#petalShape" x="275" y="350" class="petal-fall-10"/>

  <!-- === Static petals already fallen on the ground === -->
  <g opacity="0.45">
    <ellipse cx="355" cy="508" rx="3" ry="1.8" fill="#e8adb0" transform="rotate(40, 355, 508)"/>
    <ellipse cx="290" cy="515" rx="2.5" ry="1.5" fill="#f2c6c8" transform="rotate(-20, 290, 515)"/>
    <ellipse cx="400" cy="512" rx="2.8" ry="1.6" fill="#dfa0a4" transform="rotate(65, 400, 512)"/>
    <ellipse cx="320" cy="518" rx="2.2" ry="1.4" fill="#f2c6c8" transform="rotate(15, 320, 518)"/>
    <ellipse cx="370" cy="514" rx="2.6" ry="1.5" fill="#eabcbf" transform="rotate(-35, 370, 514)"/>
    <ellipse cx="250" cy="520" rx="2.4" ry="1.4" fill="#e8adb0" transform="rotate(50, 250, 520)"/>
    <ellipse cx="420" cy="516" rx="2" ry="1.3" fill="#f4cfd1" transform="rotate(-10, 420, 516)"/>
  </g>

  <!-- Subtle ground shadow under tree -->
  <ellipse cx="310" cy="522" rx="35" ry="5" fill="#7a6e62" opacity="0.15" filter="url(#softBlur)"/>

</svg>
<div class="title">02 &mdash; Minimalist Japanese Landscape</div>
</div>

</body>
</html>
