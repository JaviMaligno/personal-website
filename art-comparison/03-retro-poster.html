<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 - Retro Swiss Jazz Poster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .poster-container {
    width: 600px;
    height: 900px;
    position: relative;
    overflow: hidden;
    background: #FFF8E7;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .caption {
    margin-top: 16px;
    color: #888;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="poster-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Clip for poster bounds -->
    <clipPath id="posterClip">
      <rect width="600" height="900"/>
    </clipPath>
    <!-- Diagonal line pattern -->
    <pattern id="diagonalLines" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C4961A" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <!-- Halftone dot pattern -->
    <pattern id="halftone" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1" fill="#2D2D2D" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="600" height="900" fill="#FFF8E7"/>

  <!-- Subtle halftone texture over entire poster -->
  <rect width="600" height="900" fill="url(#halftone)"/>

  <!-- TOP CHARCOAL BAND -->
  <rect x="0" y="0" width="600" height="88" fill="#2D2D2D"/>

  <!-- Top band text: INTERNATIONALES -->
  <text x="48" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="6" fill="#FFF8E7" text-transform="uppercase">INTERNATIONALES</text>

  <!-- Top band: ZURICH 1965 -->
  <text x="48" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="300" letter-spacing="8" fill="#C4961A">ZURICH 1965</text>

  <!-- Top right geometric marks -->
  <rect x="480" y="20" width="28" height="28" fill="none" stroke="#C4961A" stroke-width="1.5"/>
  <rect x="518" y="20" width="28" height="28" fill="#D4380D"/>
  <circle cx="547" cy="68" r="8" fill="none" stroke="#FFF8E7" stroke-width="1" opacity="0.4"/>

  <!-- MAIN TITLE AREA -->

  <!-- Large geometric circle behind JAZZ -->
  <circle cx="460" cy="220" r="160" fill="#D4380D"/>

  <!-- Diagonal gold line accent -->
  <line x1="0" y1="310" x2="280" y2="88" stroke="#C4961A" stroke-width="2"/>

  <!-- "JAZZ" - massive bold type -->
  <text x="44" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="148" font-weight="900" letter-spacing="-4" fill="#2D2D2D">JAZZ</text>

  <!-- "FESTIVAL" - wide spaced below -->
  <text x="44" y="300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="300" letter-spacing="18" fill="#2D2D2D">FESTIVAL</text>

  <!-- Horizontal rule under FESTIVAL -->
  <rect x="44" y="318" width="512" height="3" fill="#2D2D2D"/>

  <!-- GEOMETRIC MUSICIAN FIGURE (abstract trumpet player) -->
  <g transform="translate(60, 360)">
    <!-- Body: large charcoal rectangle, slightly rotated -->
    <rect x="40" y="60" width="70" height="180" rx="2" fill="#2D2D2D" transform="rotate(-5, 75, 150)"/>

    <!-- Head: circle -->
    <circle cx="85" cy="40" r="30" fill="#2D2D2D"/>

    <!-- Hat brim -->
    <rect x="48" y="18" width="74" height="8" rx="2" fill="#2D2D2D"/>
    <!-- Hat top -->
    <rect x="60" y="-8" width="50" height="28" rx="2" fill="#2D2D2D"/>

    <!-- Arm reaching to trumpet -->
    <rect x="95" y="90" width="120" height="16" rx="8" fill="#2D2D2D" transform="rotate(-15, 95, 98)"/>

    <!-- Trumpet: geometric abstraction -->
    <!-- Mouthpiece -->
    <rect x="200" y="60" width="40" height="10" rx="5" fill="#C4961A"/>
    <!-- Valve section -->
    <rect x="238" y="45" width="60" height="40" rx="3" fill="#C4961A"/>
    <!-- Valve buttons -->
    <circle cx="255" cy="42" r="5" fill="#D4380D"/>
    <circle cx="270" cy="40" r="5" fill="#D4380D"/>
    <circle cx="285" cy="42" r="5" fill="#D4380D"/>
    <!-- Bell -->
    <path d="M298,50 L340,30 Q360,25 360,50 L360,75 Q360,100 340,95 L298,75 Z" fill="#C4961A"/>
    <!-- Bell opening highlight -->
    <ellipse cx="358" cy="62" rx="8" ry="24" fill="#D4380D" opacity="0.5"/>

    <!-- Sound waves emanating from bell -->
    <path d="M365,40 Q385,62 365,84" fill="none" stroke="#D4380D" stroke-width="2.5" opacity="0.7"/>
    <path d="M378,30 Q405,62 378,94" fill="none" stroke="#D4380D" stroke-width="2" opacity="0.5"/>
    <path d="M392,20 Q425,62 392,104" fill="none" stroke="#D4380D" stroke-width="1.5" opacity="0.3"/>

    <!-- Legs: two angled rectangles -->
    <rect x="40" y="230" width="18" height="80" rx="2" fill="#2D2D2D" transform="rotate(5, 50, 230)"/>
    <rect x="80" y="230" width="18" height="80" rx="2" fill="#2D2D2D" transform="rotate(-3, 90, 230)"/>

    <!-- Shoes -->
    <ellipse cx="52" cy="312" rx="18" ry="8" fill="#2D2D2D"/>
    <ellipse cx="90" cy="310" rx="18" ry="8" fill="#2D2D2D"/>
  </g>

  <!-- DECORATIVE GEOMETRIC ELEMENTS -->

  <!-- Large gold circle, partially behind musician -->
  <circle cx="140" cy="620" r="90" fill="none" stroke="#C4961A" stroke-width="2"/>
  <circle cx="140" cy="620" r="70" fill="#C4961A" opacity="0.1"/>

  <!-- Small geometric accents -->
  <rect x="500" y="400" width="60" height="60" fill="none" stroke="#D4380D" stroke-width="2" transform="rotate(45, 530, 430)"/>
  <rect x="510" y="410" width="40" height="40" fill="#D4380D" opacity="0.15" transform="rotate(45, 530, 430)"/>

  <!-- Vertical line accent right side -->
  <line x1="556" y1="88" x2="556" y2="680" stroke="#C4961A" stroke-width="1" opacity="0.4"/>

  <!-- Small dots pattern -->
  <circle cx="520" cy="520" r="3" fill="#D4380D"/>
  <circle cx="536" cy="520" r="3" fill="#D4380D"/>
  <circle cx="520" cy="536" r="3" fill="#D4380D"/>
  <circle cx="536" cy="536" r="3" fill="#D4380D"/>
  <circle cx="520" cy="552" r="3" fill="#D4380D"/>
  <circle cx="536" cy="552" r="3" fill="#D4380D"/>

  <!-- BOTTOM SECTION: LINEUP -->

  <!-- Orange band for lineup -->
  <rect x="0" y="690" width="600" height="100" fill="#D4380D"/>

  <!-- Diagonal stripe accent on orange band -->
  <rect x="0" y="690" width="600" height="100" fill="url(#diagonalLines)" opacity="0.3"/>

  <!-- Artist names -->
  <text x="300" y="726" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#FFF8E7" text-anchor="middle">MILES DAVIS</text>

  <!-- Centered dot separator -->
  <circle cx="300" cy="740" r="2.5" fill="#C4961A"/>

  <text x="300" y="758" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#FFF8E7" text-anchor="middle">JOHN COLTRANE</text>

  <circle cx="300" cy="772" r="2.5" fill="#C4961A"/>

  <text x="300" y="790" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#FFF8E7" text-anchor="middle">THELONIOUS MONK</text>

  <!-- BOTTOM INFO BAND -->
  <rect x="0" y="790" width="600" height="110" fill="#2D2D2D"/>

  <!-- Grid lines in bottom band -->
  <line x1="44" y1="815" x2="556" y2="815" stroke="#FFF8E7" stroke-width="0.5" opacity="0.2"/>

  <!-- Date and venue info -->
  <text x="44" y="838" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#C4961A">12 -- 18 NOVEMBER</text>

  <text x="44" y="860" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#FFF8E7" opacity="0.7">TONHALLE ZURICH</text>

  <!-- Right-aligned ticket info -->
  <text x="556" y="838" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#C4961A" text-anchor="end">EINTRITT CHF 8.--</text>

  <text x="556" y="860" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#FFF8E7" opacity="0.7" text-anchor="end">ABENDKASSE 20H00</text>

  <!-- Bottom rule -->
  <line x1="44" y1="876" x2="556" y2="876" stroke="#FFF8E7" stroke-width="0.5" opacity="0.2"/>

  <!-- Swiss cross mark -->
  <g transform="translate(288, 885)">
    <rect x="0" y="4" width="12" height="4" fill="#D4380D"/>
    <rect x="4" y="0" width="4" height="12" fill="#D4380D"/>
  </g>

</svg>
</div>

<div class="caption">03 - Retro Swiss Jazz Poster</div>

</body>
</html>
