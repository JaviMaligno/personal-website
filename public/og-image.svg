<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="157.5" x2="1200" y2="157.5" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Main content container -->
  <g>
    <!-- Brand badge -->
    <rect x="80" y="180" width="180" height="48" rx="8" fill="url(#accentGradient)"/>
    <text x="170" y="211" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      AGILabs
    </text>

    <!-- Main title -->
    <text x="80" y="290" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">
      AI Agent
    </text>
    <text x="80" y="360" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">
      Architecture
    </text>

    <!-- Subtitle -->
    <text x="80" y="420" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">
      Multi-agent orchestration, MCP development,
    </text>
    <text x="80" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">
      and compliance automation
    </text>

    <!-- Footer -->
    <text x="80" y="540" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#64748b">
      by Javier Aguilar
    </text>

    <!-- CTA -->
    <g>
      <rect x="80" y="565" width="200" height="40" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="url(#accentGradient)" stroke-width="1.5"/>
      <text x="180" y="592" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#6366f1" text-anchor="middle">
        View Portfolio →
      </text>
    </g>
  </g>

  <!-- Accent elements -->
  <circle cx="1050" cy="150" r="80" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="1100" cy="500" r="120" fill="url(#accentGradient)" opacity="0.08"/>
</svg>
