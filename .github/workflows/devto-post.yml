name: Publish to Dev.to

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/blog/en/**/*.md'

jobs:
  publish-devto:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install gray-matter

      - name: Detect new posts
        id: detect
        run: node scripts/linkedin/detect-new-posts.js
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.event.after }}

      - name: Publish to Dev.to
        if: steps.detect.outputs.has_new_posts == 'true'
        run: node scripts/devto/publish-to-devto.js
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          NEW_POST_PATH: ${{ steps.detect.outputs.post_path }}
          SITE_URL: 'https://www.javieraguilar.ai'

      - name: Report success
        if: success() && steps.detect.outputs.has_new_posts == 'true'
        run: |
          echo "✅ Dev.to post published successfully!"
          echo "Post: ${{ steps.detect.outputs.post_title }}"
          echo "Status: Draft (review and publish manually on Dev.to)"
