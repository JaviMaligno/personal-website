name: Scheduled publish — being-wrong-can-be-free article

# One-shot: merge the "Being Wrong Can Be Free" article branch (paper 3's
# companion) into main on 2026-09-02 so the existing deploy + Dev.to + LinkedIn
# workflows fire on the resulting push. The push MUST use a user PAT (secret
# PUBLISH_PAT) — a push made with the default GITHUB_TOKEN does NOT re-trigger
# other workflows.
#
# 09-02 rather than an earlier slot: 08-29/30 and 09-01 carry other articles,
# and 08-28/31 plus 09-03 carry posts in linkedin-scheduled-posts.yml.
# Publishing here fires linkedin-post.yml, so any of those days would put two
# LinkedIn posts out at once. 09-02 is also after paper 2's article (08-30),
# which this one links to in its opening paragraph.
#
# EXTRA GUARD, specific to this article: the post cites paper 3's preprint,
# whose arXiv ID did not exist when the branch was written. The files carry the
# literal placeholder XXXX.XXXXX. This workflow REFUSES to merge while that
# placeholder is present, so a forgotten ID means "not published" plus a
# failure issue, never a published article full of XXXX.XXXXX.
# See docs/marketing/publish-checklist-being-wrong-can-be-free.md.
on:
  # MEASURED (see docs/blog-publishing.md): GitHub's schedule queue runs these
  # LATE, not dropped; lateness shrinks through the day. Times below are DEPARTURE
  # times. Retries sit ~45min apart; the merge is idempotent (early exit once the
  # branch is in main) so the extra runs are silent no-ops.
  schedule:
    - cron: '19 8 2 9 *'    # 08:19 UTC — primary
    - cron: '7 9 2 9 *'     # 09:07 UTC — retry (+48m)
    - cron: '59 9 2 9 *'    # 09:59 UTC — retry (+52m)
    - cron: '53 13 2 9 *'   # 13:53 UTC — final safety net
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency: publish-being-wrong-can-be-free

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with PAT so the push re-triggers publish workflows)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Refuse to publish while the arXiv placeholder is unresolved
        id: guard
        run: |
          set -euo pipefail
          BRANCH=blog/being-wrong-can-be-free
          ARTICLE=src/content/blog/en/being-wrong-can-be-free.md
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch is gone; the merge step will decide whether that is a no-op."
            exit 0
          fi
          git fetch origin "$BRANCH"
          if git show "origin/$BRANCH:$ARTICLE" | grep -q 'XXXX\.XXXXX'; then
            echo "::error::$ARTICLE still contains the arXiv placeholder XXXX.XXXXX."
            echo "::error::Paper 3's preprint ID has not been substituted, so publishing"
            echo "::error::would ship an article citing arxiv.org/abs/XXXX.XXXXX."
            echo "::error::Fix: replace the placeholder on $BRANCH (see"
            echo "::error::docs/marketing/publish-checklist-being-wrong-can-be-free.md),"
            echo "::error::then re-run this workflow with workflow_dispatch."
            exit 1
          fi
          echo "Placeholder resolved — safe to publish."

      - name: Merge article branch and push
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=blog/being-wrong-can-be-free
          ARTICLE=src/content/blog/en/being-wrong-can-be-free.md
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # Branch gone. If the article is already in main it was published by hand
            # and the branch deleted — a no-op, not a failure.
            if [ -f "$ARTICLE" ]; then
              echo "Branch '$BRANCH' is gone and $ARTICLE is already in main —"
              echo "already published (manual merge + branch deleted). Nothing to do."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Branch '$BRANCH' does not exist on origin and $ARTICLE is not"
            echo "::error::in main either — the branch name in this workflow is likely wrong."
            echo 'Existing blog branches:'
            git ls-remote --heads origin 'refs/heads/blog/*' | sed 's#.*refs/heads/#  - #' || true
            exit 1
          fi
          git fetch origin "$BRANCH"
          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "Branch already merged into main — nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff "origin/$BRANCH" \
            -m "Publish: being-wrong-can-be-free article (scheduled 2026-09-02)"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Only after the merge is pushed. The article now lives in main, so the
      # branch carries nothing unique: a failed Dev.to/LinkedIn run is retried
      # from main via workflow_dispatch, never from this branch.
      - name: Delete the published branch
        if: success() && steps.merge.outputs.published == 'true'
        run: |
          git push origin --delete blog/being-wrong-can-be-free \
            || echo "::warning::Could not delete blog/being-wrong-can-be-free — remove it by hand (non-fatal)"

      - name: Notify success
        if: success() && steps.merge.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "✅ Being Wrong Can Be Free published (scheduled)" \
            --body "blog/being-wrong-can-be-free was merged into main on schedule and the branch was deleted. Deploy + Dev.to + LinkedIn should be running now. Verify: https://www.javieraguilar.ai/en/blog/being-wrong-can-be-free

          Still to do by hand (see docs/marketing/publish-checklist-being-wrong-can-be-free.md): post the 13-tweet X thread with the real arXiv ID, and check the two internal links to the paper-2 article resolve." \
            || echo "issue creation failed (non-fatal)"

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ Scheduled being-wrong-can-be-free publish FAILED" \
            --body "The scheduled merge did not complete. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Most likely cause: the arXiv placeholder guard fired because paper 3's preprint ID has not been substituted on the branch yet. See docs/marketing/publish-checklist-being-wrong-can-be-free.md, replace XXXX.XXXXX, then re-run this workflow with workflow_dispatch." \
            || echo "issue creation failed (non-fatal)"
