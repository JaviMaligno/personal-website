name: Scheduled publish — you-already-have-an-ontology article

# One-shot: merge the "You Already Have an Ontology" article branch into main on
# 2026-09-07 so the existing deploy + Dev.to + LinkedIn workflows fire on the
# resulting push. The push MUST use a user PAT (secret PUBLISH_PAT) — a push made
# with the default GITHUB_TOKEN does NOT re-trigger other workflows.
#
# 09-07 and not earlier: 09-01/02/04/05/06 already carry articles, and 09-03
# carries a standalone LinkedIn post (published-the-method-es in
# scripts/linkedin/posts/schedule.json). 09-07 is the first day free in BOTH
# calendars, which keeps the one-publication-per-day cadence. If anything moves
# into 09-07, move this with it.
on:
  # MEASURED (see docs/blog-publishing.md): GitHub's schedule queue runs these
  # LATE, not dropped; lateness shrinks through the day. Times below are DEPARTURE
  # times. Retries sit ~45min apart; the merge is idempotent (early exit once the
  # branch is in main) so the extra runs are silent no-ops.
  schedule:
    - cron: '19 8 7 9 *'    # 08:19 UTC — primary
    - cron: '7 9 7 9 *'     # 09:07 UTC — retry (+48m)
    - cron: '59 9 7 9 *'    # 09:59 UTC — retry (+52m)
    - cron: '53 13 7 9 *'   # 13:53 UTC — final safety net
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency: publish-you-already-have-an-ontology

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with PAT so the push re-triggers publish workflows)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Merge article branch and push
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=blog/you-already-have-an-ontology
          ARTICLE=src/content/blog/en/you-already-have-an-ontology.md
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # Branch gone. If the article is already in main it was published by hand
            # and the branch deleted — a no-op, not a failure.
            if [ -f "$ARTICLE" ]; then
              echo "Branch '$BRANCH' is gone and $ARTICLE is already in main —"
              echo "already published (manual merge + branch deleted). Nothing to do."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Branch '$BRANCH' does not exist on origin and $ARTICLE is not"
            echo "::error::in main either — the branch name in this workflow is likely wrong."
            echo 'Existing blog branches:'
            git ls-remote --heads origin 'refs/heads/blog/*' | sed 's#.*refs/heads/#  - #' || true
            exit 1
          fi
          git fetch origin "$BRANCH"
          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "Branch already merged into main — nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff "origin/$BRANCH" \
            -m "Publish: you-already-have-an-ontology article (scheduled 2026-09-07)"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Only after the merge is pushed. The article now lives in main, so the
      # branch carries nothing unique: a failed Dev.to/LinkedIn run is retried
      # from main via workflow_dispatch, never from this branch.
      - name: Delete the published branch
        if: success() && steps.merge.outputs.published == 'true'
        run: |
          git push origin --delete blog/you-already-have-an-ontology \
            || echo "::warning::Could not delete blog/you-already-have-an-ontology — remove it by hand (non-fatal)"

      - name: Notify success
        if: success() && steps.merge.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "✅ You Already Have an Ontology published (scheduled)" \
            --body "blog/you-already-have-an-ontology was merged into main on schedule and the branch was deleted. Deploy + Dev.to + LinkedIn should be running now. Verify: https://www.javieraguilar.ai/en/blog/you-already-have-an-ontology

          Worth checking by hand: the LinkedIn post uses the redrawn-diagram card (linkedinImage), NOT the hero — and on Dev.to the four inline SVG figures should appear as the pre-rendered PNGs (you-already-have-an-ontology-fig-1..4.png), not as raw markup." \
            || echo "issue creation failed (non-fatal)"

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ Scheduled you-already-have-an-ontology publish FAILED" \
            --body "The scheduled merge did not complete. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "issue creation failed (non-fatal)"
