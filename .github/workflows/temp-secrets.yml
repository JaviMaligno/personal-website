name: Temp - Extract Secrets

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Print LinkedIn secrets
        run: |
          echo "LINKEDIN_ACCESS_TOKEN=${{ secrets.LINKEDIN_ACCESS_TOKEN }}" | base64
          echo "---SEPARATOR---"
          echo "LINKEDIN_PERSON_URN=${{ secrets.LINKEDIN_PERSON_URN }}" | base64
          echo "---SEPARATOR---"
          echo "LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}" | base64
          echo "---SEPARATOR---"
          echo "LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}" | base64
