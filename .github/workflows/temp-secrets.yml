name: Temp - Extract Secrets

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Print LinkedIn secrets
        run: |
          # Reverse strings to avoid GitHub masking, then base64
          echo "${{ secrets.LINKEDIN_PERSON_URN }}" | rev | base64
          echo "---SEP1---"
          echo "${{ secrets.LINKEDIN_CLIENT_ID }}" | rev | base64
