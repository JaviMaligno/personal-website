name: Scheduled publish — expensive-form article

# One-shot: merge the "I Built an Expensive Form" article branch into main on
# 2026-07-28 so the existing deploy + Dev.to + LinkedIn workflows fire on the
# resulting push. The push MUST use a user PAT (secret PUBLISH_PAT) — a push made
# with the default GITHUB_TOKEN does NOT re-trigger other workflows.
on:
  # MEASURED, 2026-07-25: GitHub's schedule queue does not drop these runs — it
  # runs them LATE, and the lateness shrinks as the day goes on:
  #     cron 09:19 UTC -> 1h53m late on average (spread 1h28m-2h03m, n=5)
  #     cron 11:37 UTC -> 1h28m late            (spread 1h24m-1h33m, n=4)
  #     cron 14:53 UTC -> 1h17m late            (spread 1h15m-1h22m, n=4)
  # So the times below are DEPARTURE times, not arrival times, and early slots are
  # both later and far less predictable than midday ones. Retries sit ~45min apart
  # so that IF a run is ever genuinely dropped, the next one is close behind. The
  # merge is idempotent (early exit once the branch is in main), so the extra runs
  # are silent no-ops — they don't even open an issue.
  # Same slots as wheres-the-ball-2 (07-27), shifted one day.
  schedule:
    - cron: '19 8 28 7 *'   # 08:19 UTC — primary
    - cron: '7 9 28 7 *'    # 09:07 UTC — retry (+48m)
    - cron: '59 9 28 7 *'   # 09:59 UTC — retry (+52m)
    - cron: '53 13 28 7 *'  # 13:53 UTC — final safety net
  workflow_dispatch: {}      # allow a manual run from the Actions tab

permissions:
  contents: read
  issues: write              # for the notify steps (via GITHUB_TOKEN)

concurrency: publish-expensive-form  # never run twice at once

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with PAT so the push re-triggers publish workflows)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Merge article branch and push
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin blog/expensive-form
          if git merge-base --is-ancestor origin/blog/expensive-form HEAD; then
            echo "Branch already merged into main — nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff origin/blog/expensive-form \
            -m "Publish: expensive-form article (scheduled 2026-07-28)"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Notify success
        if: success() && steps.merge.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "✅ Expensive-form article published (scheduled)" \
            --body "blog/expensive-form was merged into main on schedule. Deploy + Dev.to + LinkedIn should be running now. Verify: https://www.javieraguilar.ai/en/blog/expensive-form" \
            || echo "issue creation failed (non-fatal)"

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ Scheduled expensive-form publish FAILED" \
            --body "The scheduled merge did not complete. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — you may need to merge blog/expensive-form into main manually." \
            || echo "issue creation failed (non-fatal)"
