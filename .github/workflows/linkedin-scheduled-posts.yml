name: LinkedIn Scheduled Posts

on:
  schedule:
    # Every day at 8:00 UTC = 9:00 BST (Europe/London)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger

# A late cron run and a manual dispatch must never post the same entry twice:
# runs are serialised, and a run that publishes leaves a `linkedin-posted-<date>`
# artifact that later runs of the same day look for before posting.
concurrency:
  group: linkedin-scheduled-posts
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish-if-scheduled:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Check schedule and publish
        id: publish
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Today is $TODAY"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          # Read schedule and find today's post
          POST_FILE=$(node -e "
            const schedule = JSON.parse(require('fs').readFileSync('scripts/linkedin/posts/schedule.json', 'utf-8'));
            const today = '$TODAY';
            const entry = schedule.find(e => e.date === today);
            if (entry && entry.posted) {
              console.error('⏭️  ' + entry.file + ' is marked posted: true, skipping.');
              console.log('');
            } else if (entry) {
              console.log(entry.file);
            } else {
              console.log('');
            }
          ")

          if [ -z "$POST_FILE" ]; then
            echo "📅 No post scheduled for today ($TODAY). Exiting."
            exit 0
          fi

          echo "📝 Found scheduled post: $POST_FILE"

          # Did an earlier run today already publish it?
          ALREADY=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=linkedin-posted-$TODAY" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if [ "$ALREADY" != "0" ]; then
            echo "⏭️  An earlier run already posted today's entry (artifact linkedin-posted-$TODAY). Exiting."
            exit 0
          fi

          node scripts/linkedin/post-standalone.js "$POST_FILE"
          printf '%s\n' "$POST_FILE" > posted.txt
          echo "posted=true" >> "$GITHUB_OUTPUT"

      - name: Record that today's entry was posted
        if: steps.publish.outputs.posted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-posted-${{ steps.publish.outputs.today }}
          path: posted.txt
          retention-days: 7
