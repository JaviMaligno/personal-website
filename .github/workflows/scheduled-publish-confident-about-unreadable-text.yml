name: Scheduled publish — confident-about-unreadable-text article

# One-shot: merge the "Confident About Text It Cannot Read" article branch into
# main on 2026-08-01 so the existing deploy + Dev.to + LinkedIn workflows fire on
# the resulting push. The push MUST use a user PAT (secret PUBLISH_PAT) — a push
# made with the default GITHUB_TOKEN does NOT re-trigger other workflows.
#
# This branch also carries a CORRECTION to an already-published article
# (ciphers-edges-of-language). detect-new-posts.js only acts on files added in the
# diff and skips modified ones, so that correction reaches the website but not
# Dev.to on its own — hence the explicit Dev.to dispatch step below.
on:
  # MEASURED (see wheres-the-ball-2 workflow): GitHub's schedule queue runs these
  # LATE, not dropped; lateness shrinks through the day. Times below are DEPARTURE
  # times. Retries sit ~45min apart; the merge is idempotent (early exit once the
  # branch is in main) so the extra runs are silent no-ops.
  schedule:
    - cron: '19 8 1 8 *'   # 08:19 UTC — primary
    - cron: '7 9 1 8 *'    # 09:07 UTC — retry (+48m)
    - cron: '59 9 1 8 *'   # 09:59 UTC — retry (+52m)
    - cron: '53 13 1 8 *'  # 13:53 UTC — final safety net
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

concurrency: publish-confident-about-unreadable-text

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with PAT so the push re-triggers publish workflows)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Merge article branch and push
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=blog/ciphers-full
          ARTICLE=src/content/blog/en/confident-about-unreadable-text.md
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # Branch gone. If the article is already in main it was published by hand
            # and the branch deleted — a no-op, not a failure.
            if [ -f "$ARTICLE" ]; then
              echo "Branch '$BRANCH' is gone and $ARTICLE is already in main —"
              echo "already published (manual merge + branch deleted). Nothing to do."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Branch '$BRANCH' does not exist on origin and $ARTICLE is not"
            echo "::error::in main either — the branch name in this workflow is likely wrong."
            echo 'Existing blog branches:'
            git ls-remote --heads origin 'refs/heads/blog/*' | sed 's#.*refs/heads/#  - #' || true
            exit 1
          fi
          git fetch origin "$BRANCH"
          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "Branch already merged into main — nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff "origin/$BRANCH" \
            -m "Publish: confident-about-unreadable-text article (scheduled 2026-08-01)"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The correction to the ALREADY-published cipher article is a modification,
      # so the push-triggered Dev.to job skips it. Push it explicitly.
      # publish-to-devto.js looks the article up by canonical_url and PUTs, so this
      # updates the existing Dev.to post rather than duplicating it. Non-fatal: the
      # article publication must not fail because a cross-post update did.
      - name: Update the corrected cipher article on Dev.to
        if: success() && steps.merge.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_PAT }}
        run: |
          gh workflow run devto-post.yml \
            --ref main \
            -f post_path=src/content/blog/en/ciphers-edges-of-language.md \
            || echo "::warning::Could not dispatch the Dev.to update for ciphers-edges-of-language — run it by hand from the Actions tab"

      # Only after the merge is pushed. The article now lives in main, so the
      # branch carries nothing unique: a failed Dev.to/LinkedIn run is retried
      # from main via workflow_dispatch, never from this branch.
      - name: Delete the published branch
        if: success() && steps.merge.outputs.published == 'true'
        run: |
          git push origin --delete blog/ciphers-full \
            || echo "::warning::Could not delete blog/ciphers-full — remove it by hand (non-fatal)"

      - name: Notify success
        if: success() && steps.merge.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "✅ Confident About Text It Cannot Read published (scheduled)" \
            --body "blog/ciphers-full was merged into main on schedule and the branch was deleted. Deploy + Dev.to + LinkedIn should be running now. Verify: https://www.javieraguilar.ai/en/blog/confident-about-unreadable-text

          **Also check the correction.** This branch edits the already-published \`ciphers-edges-of-language\` article (its jailbreak section is retracted). A Dev.to update for it was dispatched automatically — confirm the *Publish to Dev.to* run for \`src/content/blog/en/ciphers-edges-of-language.md\` succeeded, and if it did not, run it by hand from the Actions tab. The LinkedIn post from that article's original publication cannot be corrected automatically." \
            || echo "issue creation failed (non-fatal)"

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ Scheduled confident-about-unreadable-text publish FAILED" \
            --body "The scheduled merge did not complete. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — you may need to merge blog/ciphers-full into main manually (or run the workflow_dispatch)." \
            || echo "issue creation failed (non-fatal)"
