name: Scheduled publish — wheres-the-ball-2 article

# One-shot: merge the "Where's the Ball? Part 2" article branch into main on
# 2026-07-27 so the existing deploy + Dev.to + LinkedIn workflows fire on the
# resulting push. The push MUST use a user PAT (secret PUBLISH_PAT) — a push made
# with the default GITHUB_TOKEN does NOT re-trigger other workflows.
on:
  # MEASURED, 2026-07-25: GitHub's schedule queue does not drop these runs — it
  # runs them LATE, and the lateness shrinks as the day goes on:
  #     cron 09:19 UTC -> 1h53m late on average (spread 1h28m-2h03m, n=5)
  #     cron 11:37 UTC -> 1h28m late            (spread 1h24m-1h33m, n=4)
  #     cron 14:53 UTC -> 1h17m late            (spread 1h15m-1h22m, n=4)
  # Plus 20 straight days of the daily 08:00 UTC cron: it fired EVERY day, always
  # 1h21m-4h02m late (median 2h13m). Nothing has ever been dropped here.
  # So: the times below are DEPARTURE times, not arrival times — and early slots
  # are both later and far less predictable than midday ones. If you want a
  # predictable hour, schedule LATER, not earlier.
  # Retries sit ~45min apart so that IF a run is ever genuinely dropped, the next
  # one is close behind. The merge is idempotent (early exit once the branch is in
  # main), so the extra runs are silent no-ops — they don't even open an issue.
  schedule:
    - cron: '19 8 27 7 *'   # 08:19 UTC — primary
    - cron: '7 9 27 7 *'    # 09:07 UTC — retry (+48m)
    - cron: '59 9 27 7 *'   # 09:59 UTC — retry (+52m)
    - cron: '53 13 27 7 *'  # 13:53 UTC — final safety net
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency: publish-wheres-the-ball-2

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with PAT so the push re-triggers publish workflows)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Merge article branch and push
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=blog/wheres-the-ball-2
          # Fail loudly on a wrong branch name. A typo here used to surface only on
          # publication day, as an opaque "couldn't find remote ref" (see the 07-23 run).
          ARTICLE=src/content/blog/en/wheres-the-ball-2.md
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # Branch gone. If the article is already in main it was published by hand
            # and the branch deleted — a no-op, not a failure. Late cron runs used to
            # open false "FAILED" issues in exactly this case (07-20, 07-23, 07-24).
            if [ -f "$ARTICLE" ]; then
              echo "Branch '$BRANCH' is gone and $ARTICLE is already in main —"
              echo "already published (manual merge + branch deleted). Nothing to do."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Branch '$BRANCH' does not exist on origin and $ARTICLE is not"
            echo "::error::in main either — the branch name in this workflow is likely wrong."
            echo 'Existing blog branches:'
            git ls-remote --heads origin 'refs/heads/blog/*' | sed 's#.*refs/heads/#  - #' || true
            exit 1
          fi
          git fetch origin "$BRANCH"
          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "Branch already merged into main — nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff "origin/$BRANCH" \
            -m "Publish: wheres-the-ball-2 article (scheduled 2026-07-27)"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Notify success
        if: success() && steps.merge.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "✅ Where's-the-ball Part 2 published (scheduled)" \
            --body "blog/wheres-the-ball-2 was merged into main on schedule. Deploy + Dev.to + LinkedIn should be running now. Verify: https://www.javieraguilar.ai/en/blog/wheres-the-ball-2" \
            || echo "issue creation failed (non-fatal)"

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ Scheduled wheres-the-ball-2 publish FAILED" \
            --body "The scheduled merge did not complete. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — you may need to merge blog/wheres-the-ball-2 into main manually (or run the workflow_dispatch)." \
            || echo "issue creation failed (non-fatal)"
