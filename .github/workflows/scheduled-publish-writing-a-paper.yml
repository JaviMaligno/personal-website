name: Scheduled publish — writing-a-paper-with-ai article

# One-shot: merge the "writing a paper with AI" article branch into main on
# 2026-07-21 so the existing deploy + LinkedIn + Dev.to workflows fire on the
# resulting push. The push MUST use a user PAT (secret PUBLISH_PAT) — a push
# made with the default GITHUB_TOKEN does NOT re-trigger other workflows.
on:
  # GitHub cron is best-effort and drops runs under load — the top of the hour
  # (:00) is the worst slot. So we fire at an off-peak minute and RETRY a few
  # times the same day. The merge below is idempotent (it exits early once the
  # branch is already in main), so the extra runs are safe no-ops.
  schedule:
    - cron: '19 9 21 7 *'   # 2026-07-21 09:19 UTC (~11:19 CEST) — primary
    - cron: '37 11 21 7 *'  # 2026-07-21 11:37 UTC — retry if the primary was dropped
    - cron: '53 14 21 7 *'  # 2026-07-21 14:53 UTC — final retry
  workflow_dispatch: {}      # allow a manual run from the Actions tab

permissions:
  contents: read
  issues: write              # for the notify steps (via GITHUB_TOKEN)

concurrency: publish-writing-a-paper  # never run twice at once

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with PAT so the push re-triggers publish workflows)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Merge article branch and push
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin blog/writing-a-paper-with-ai
          if git merge-base --is-ancestor origin/blog/writing-a-paper-with-ai HEAD; then
            echo "Branch already merged into main — nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff origin/blog/writing-a-paper-with-ai \
            -m "Publish: writing-a-paper-with-ai article (scheduled 2026-07-21)"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Notify success
        if: success() && steps.merge.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "✅ Writing-a-paper-with-AI article published (scheduled)" \
            --body "blog/writing-a-paper-with-ai was merged into main on schedule. Deploy + LinkedIn + Dev.to should be running now. Verify: https://www.javieraguilar.ai/en/blog/writing-a-research-paper-with-ai" \
            || echo "issue creation failed (non-fatal)"

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ Scheduled writing-a-paper publish FAILED" \
            --body "The scheduled merge did not complete. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — you may need to merge blog/writing-a-paper-with-ai into main manually." \
            || echo "issue creation failed (non-fatal)"
