name: Scheduled publish — death-of-prompt-engineering article

# One-shot: merge the "Death of the Prompt Engineer" article branch into main on
# 2026-07-25 so the existing deploy + Dev.to + LinkedIn workflows fire on the
# resulting push. The push MUST use a user PAT (secret PUBLISH_PAT) — a push made
# with the default GITHUB_TOKEN does NOT re-trigger other workflows.
on:
  # GitHub cron is best-effort and drops runs under load — the top of the hour
  # (:00) is the worst slot. So we fire at an off-peak minute and RETRY a few
  # times the same day. The merge below is idempotent (it exits early once the
  # branch is already in main), so the extra runs are safe no-ops.
  schedule:
    - cron: '19 9 25 7 *'   # 2026-07-25 09:19 UTC (~11:19 CEST) — primary
    - cron: '37 11 25 7 *'  # 2026-07-25 11:37 UTC — retry if the primary was dropped
    - cron: '53 14 25 7 *'  # 2026-07-25 14:53 UTC — final retry
  workflow_dispatch: {}      # allow a manual run from the Actions tab

permissions:
  contents: read
  issues: write              # for the notify steps (via GITHUB_TOKEN)

concurrency: publish-death-of-prompt-engineering  # never run twice at once

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with PAT so the push re-triggers publish workflows)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Merge article branch and push
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=blog/death-of-prompt-engineering
          # Fail loudly on a wrong branch name. A typo here used to surface only on
          # publication day, as an opaque "couldn't find remote ref" (see the 07-23 run).
          ARTICLE=src/content/blog/en/death-of-prompt-engineering.md
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # Branch gone. If the article is already in main it was published by hand
            # and the branch deleted — a no-op, not a failure. Late cron runs used to
            # open false "FAILED" issues in exactly this case (07-20, 07-23, 07-24).
            if [ -f "$ARTICLE" ]; then
              echo "Branch '$BRANCH' is gone and $ARTICLE is already in main —"
              echo "already published (manual merge + branch deleted). Nothing to do."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Branch '$BRANCH' does not exist on origin and $ARTICLE is not"
            echo "::error::in main either — the branch name in this workflow is likely wrong."
            echo 'Existing blog branches:'
            git ls-remote --heads origin 'refs/heads/blog/*' | sed 's#.*refs/heads/#  - #' || true
            exit 1
          fi
          git fetch origin "$BRANCH"
          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "Branch already merged into main — nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff "origin/$BRANCH" \
            -m "Publish: death-of-prompt-engineering article (scheduled 2026-07-25)"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Notify success
        if: success() && steps.merge.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "✅ Death-of-the-prompt-engineer article published (scheduled)" \
            --body "blog/death-of-prompt-engineering was merged into main on schedule. Deploy + Dev.to + LinkedIn should be running now. Verify: https://www.javieraguilar.ai/en/blog/death-of-prompt-engineering" \
            || echo "issue creation failed (non-fatal)"

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ Scheduled death-of-prompt-engineering publish FAILED" \
            --body "The scheduled merge did not complete. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — you may need to merge blog/death-of-prompt-engineering into main manually." \
            || echo "issue creation failed (non-fatal)"
