name: Scheduled publish — building-is-no-longer-the-bottleneck article

# One-shot: merge the "Building Is No Longer the Bottleneck" article branch
# into main on 2026-09-14 so deploy + Dev.to + LinkedIn workflows run from the
# resulting push. PUBLISH_PAT is required because GITHUB_TOKEN pushes do not
# re-trigger other workflows.
on:
  # MEASURED (see docs/blog-publishing.md): scheduled runs may start late.
  # Retries are separated and the merge is idempotent, so later runs are no-ops.
  schedule:
    - cron: '19 8 14 9 *'   # 08:19 UTC — primary
    - cron: '7 9 14 9 *'    # 09:07 UTC — retry (+48m)
    - cron: '59 9 14 9 *'   # 09:59 UTC — retry (+52m)
    - cron: '53 13 14 9 *'  # 13:53 UTC — final safety net
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency: publish-building-is-no-longer-the-bottleneck

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with PAT so the push re-triggers publish workflows)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Merge article branch and push
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=blog/building-is-no-longer-the-bottleneck
          ARTICLE=src/content/blog/en/building-is-no-longer-the-bottleneck.md
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # Branch gone. If the article is already in main it was published by
            # hand and deleted, which is a no-op rather than a failure.
            if [ -f "$ARTICLE" ]; then
              echo "Branch '$BRANCH' is gone and $ARTICLE is already in main —"
              echo "already published (manual merge + branch deleted). Nothing to do."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Branch '$BRANCH' does not exist on origin and $ARTICLE is not"
            echo "::error::in main either — the workflow branch is likely wrong."
            echo 'Existing blog branches:'
            git ls-remote --heads origin 'refs/heads/blog/*' | sed 's#.*refs/heads/#  - #' || true
            exit 1
          fi
          git fetch origin "$BRANCH"
          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "Branch already merged into main — nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff "origin/$BRANCH" \
            -m "Publish: building-is-no-longer-the-bottleneck article (scheduled 2026-09-14)"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Once merged, the article is in main and downstream failures can be
      # retried there via workflow_dispatch; the source branch is no longer needed.
      - name: Delete the published branch
        if: success() && steps.merge.outputs.published == 'true'
        run: |
          git push origin --delete blog/building-is-no-longer-the-bottleneck \
            || echo "::warning::Could not delete blog/building-is-no-longer-the-bottleneck — remove it by hand (non-fatal)"

      - name: Notify success
        if: success() && steps.merge.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "✅ Building Is No Longer the Bottleneck published (scheduled)" \
            --body "blog/building-is-no-longer-the-bottleneck was merged into main on schedule and the branch was deleted. Deploy + Dev.to + LinkedIn should be running now. Verify: https://www.javieraguilar.ai/en/blog/building-is-no-longer-the-bottleneck" \
            || echo "issue creation failed (non-fatal)"

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ Scheduled building-is-no-longer-the-bottleneck publish FAILED" \
            --body "The scheduled merge did not complete. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — you may need to merge blog/building-is-no-longer-the-bottleneck into main manually (or run workflow_dispatch)." \
            || echo "issue creation failed (non-fatal)"
